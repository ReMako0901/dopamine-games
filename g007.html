<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>軌道分裂</title>
  <style>
    html, body { margin: 0; height: 100%; background: #07080d; overflow: hidden; overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; background: #07080d; }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";

const canvas = document.getElementById("game");
const context = canvas.getContext("2d", { alpha: false });
const MAX_BALLS = 240;
const CORE_RADIUS = 24;
const BALL_RADIUS = 5;
const GRAVITY = 900000;
const DOUBLE_TAP_WINDOW = 320;
const COLORS = ["#77a6ff", "#8fd7a7", "#ffcc76", "#ff8f8f"];

let width = 1;
let height = 1;
let balls = [];
let corePulse = 0;
let lastTapTime = -DOUBLE_TAP_WINDOW;
let lastFrameTime = 0;

function formatBigInt(value) {
  return value.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

function resize() {
  const devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
  width = Math.max(1, canvas.clientWidth || window.innerWidth);
  height = Math.max(1, canvas.clientHeight || window.innerHeight);
  canvas.width = Math.floor(width * devicePixelRatio);
  canvas.height = Math.floor(height * devicePixelRatio);
  context.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}

function createOrbitBall(angle, orbitRadius) {
  const speed = Math.sqrt(GRAVITY / Math.max(40, orbitRadius));
  const clockwise = Math.random() < 0.5 ? 1 : -1;
  return {
    x: width / 2 + Math.cos(angle) * orbitRadius,
    y: height / 2 + Math.sin(angle) * orbitRadius,
    vx: -Math.sin(angle) * speed * clockwise,
    vy: Math.cos(angle) * speed * clockwise,
    color: COLORS[Math.floor(Math.random() * COLORS.length)]
  };
}

function reset() {
  balls = [];
  for (let index = 0; index < 14; index++) {
    balls.push(createOrbitBall((index / 14) * Math.PI * 2, 82 + (index % 3) * 24));
  }
  corePulse = 1;
}

function spawnBall() {
  const angle = Math.random() * Math.PI * 2;
  const orbitRadius = Math.max(76, Math.min(width, height) * (0.25 + Math.random() * 0.14));
  balls.push(createOrbitBall(angle, orbitRadius));
  corePulse = 1;
}

function splitBall(ball) {
  const centerX = width / 2;
  const centerY = height / 2;
  const dx = ball.x - centerX;
  const dy = ball.y - centerY;
  const distance = Math.hypot(dx, dy) || 1;
  const normalX = dx / distance;
  const normalY = dy / distance;
  const orbitRadius = Math.max(CORE_RADIUS + BALL_RADIUS + 50, Math.min(distance * 1.12, Math.min(width, height) * 0.47));
  const speed = Math.sqrt(GRAVITY / orbitRadius) * 1.03;
  const baseAngle = Math.atan2(normalY, normalX);

  for (let side = -1; side <= 1; side += 2) {
    const angle = baseAngle + side * 0.05;
    balls.push({
      x: centerX + Math.cos(angle) * orbitRadius,
      y: centerY + Math.sin(angle) * orbitRadius,
      vx: -Math.sin(angle) * speed * side + normalX * 26,
      vy: Math.cos(angle) * speed * side + normalY * 26,
      color: COLORS[Math.floor(Math.random() * COLORS.length)]
    });
  }
}

function update(delta) {
  const centerX = width / 2;
  const centerY = height / 2;
  const splitQueue = [];

  for (let index = balls.length - 1; index >= 0; index--) {
    const ball = balls[index];
    const dx = centerX - ball.x;
    const dy = centerY - ball.y;
    const distanceSquared = Math.max(100, dx * dx + dy * dy);
    const distance = Math.sqrt(distanceSquared);
    const acceleration = GRAVITY / distanceSquared;
    ball.vx += (dx / distance) * acceleration * delta;
    ball.vy += (dy / distance) * acceleration * delta;
    ball.x += ball.vx * delta;
    ball.y += ball.vy * delta;

    if (distance <= CORE_RADIUS + BALL_RADIUS) {
      balls.splice(index, 1);
      if (balls.length + splitQueue.length < MAX_BALLS) splitQueue.push(ball);
      corePulse = 1;
    }
  }

  for (const ball of splitQueue) splitBall(ball);
  if (balls.length === 0) balls.push(createOrbitBall(0, 96));
  corePulse = Math.max(0, corePulse - delta * 2.5);
}

function drawNumber(value) {
  const text = formatBigInt(value);
  let size = Math.min(width * 0.28, height * 0.22);
  const maxWidth = width * 0.90;
  do {
    context.font = `700 ${size}px "Helvetica Neue", Arial, sans-serif`;
    if (context.measureText(text).width <= maxWidth) break;
    size *= 0.88;
  } while (size > 9);
  context.textAlign = "center";
  context.textBaseline = "middle";
  context.fillStyle = "#eaf0ff";
  context.fillText(text, width / 2, height * 0.16);
}

function frame(now) {
  if (!lastFrameTime) lastFrameTime = now;
  const delta = Math.min((now - lastFrameTime) / 1000, 0.035);
  lastFrameTime = now;
  update(delta);

  context.fillStyle = "#07080d";
  context.fillRect(0, 0, width, height);
  const coreSize = CORE_RADIUS * (1 + corePulse * 0.18);
  context.beginPath();
  context.arc(width / 2, height / 2, coreSize, 0, Math.PI * 2);
  context.fillStyle = "#31427b";
  context.fill();
  context.beginPath();
  context.arc(width / 2, height / 2, coreSize * 0.48, 0, Math.PI * 2);
  context.fillStyle = "#7c95d8";
  context.fill();

  for (const ball of balls) {
    context.beginPath();
    context.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
    context.fillStyle = ball.color;
    context.fill();
  }
  drawNumber(BigInt(balls.length));
  requestAnimationFrame(frame);
}

canvas.addEventListener("pointerdown", (event) => {
  event.preventDefault();
  const now = performance.now();
  if (now - lastTapTime < DOUBLE_TAP_WINDOW) {
    reset();
    lastTapTime = -DOUBLE_TAP_WINDOW;
  } else {
    lastTapTime = now;
    if (balls.length < MAX_BALLS) spawnBall();
  }
}, { passive: false });

window.addEventListener("resize", resize);
window.addEventListener("orientationchange", resize);

resize();
reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
