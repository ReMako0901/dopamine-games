<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>ペグ落下2</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0a0c12; overflow: hidden; overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; background: #0a0c12; }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";

const canvas = document.getElementById("game");
const context = canvas.getContext("2d", { alpha: false });
const BOARD_TYPE = "triangles";
const BALL_RADIUS = 8;
const MAX_BALLS = 1800;
const SPAWN_INTERVAL = 0.8;
const COOLDOWN = 0.55;
const GRAVITY = 260;
const RESTITUTION = 0.78;
const FRICTION = 0.995;
const MAX_SPEED = 500;
const SUBSTEPS = 2;
const DOUBLE_TAP_WINDOW = 0.32;
const FEVER_MODE = false;
const FEVER_DURATION = 10;
const MULTIPLIERS = [1, 2, 4, 8, 4, 2, 1];
const BIN_COLORS = ["#25324a", "#294f43", "#2e5f7a", "#70543a", "#2e5f7a", "#294f43", "#25324a"];

let width = 0;
let height = 0;
let obstacles = [];
let bins = [];
let binTop = 0;
let balls = [];
let score = 0;
let started = false;
let spawnTimer = 0;
let lastTapTime = -1;
let lastFrameTime = 0;
let feverActive = false;
let feverTimer = 0;
let nextFever = 12 + Math.random() * 8;

function formatScore(value) {
  return String(value).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

function addObstacle(obstacle) {
  const padding = obstacle.type === "segment" ? obstacle.thickness : obstacle.radius || 0;
  if (obstacle.type === "segment") {
    obstacle.minX = Math.min(obstacle.x1, obstacle.x2) - padding;
    obstacle.maxX = Math.max(obstacle.x1, obstacle.x2) + padding;
    obstacle.minY = Math.min(obstacle.y1, obstacle.y2) - padding;
    obstacle.maxY = Math.max(obstacle.y1, obstacle.y2) + padding;
  } else if (obstacle.type === "circle") {
    obstacle.minX = obstacle.cx - padding;
    obstacle.maxX = obstacle.cx + padding;
    obstacle.minY = obstacle.cy - padding;
    obstacle.maxY = obstacle.cy + padding;
  } else {
    obstacle.minX = obstacle.cx - obstacle.radius - BALL_RADIUS;
    obstacle.maxX = obstacle.cx + obstacle.radius + BALL_RADIUS;
    obstacle.minY = obstacle.cy - obstacle.radius - BALL_RADIUS;
    obstacle.maxY = obstacle.cy + obstacle.radius + BALL_RADIUS;
  }
  obstacles.push(obstacle);
}

function addPolygon(cx, cy, radius, kind) {
  const points = [];
  if (kind === "triangle") {
    points.push({ x: cx, y: cy - radius }, { x: cx + radius * 0.82, y: cy + radius * 0.72 }, { x: cx - radius * 0.82, y: cy + radius * 0.72 });
  } else {
    points.push({ x: cx, y: cy - radius }, { x: cx + radius * 0.62, y: cy }, { x: cx, y: cy + radius }, { x: cx - radius * 0.62, y: cy });
  }
  addObstacle({ type: "polygon", kind, cx, cy, radius, points });
}

function buildBoard() {
  obstacles = [];
  bins = [];
  const binHeight = Math.max(54, Math.min(height * 0.08, 78));
  binTop = height - binHeight;
  const scoreAreaHeight = Math.max(96, Math.min(height * 0.18, 150));
  const top = scoreAreaHeight + 26;
  const bottom = binTop - 30;
  const boardHeight = Math.max(120, bottom - top);

  if (BOARD_TYPE === "bars") {
    const rows = 8;
    for (let row = 0; row < rows; row++) {
      const y = top + (row + 0.5) * boardHeight / rows;
      const leftward = row % 2 === 0;
      for (let column = 0; column < 3; column++) {
        const x0 = width * (0.1 + column * 0.3);
        const x1 = x0 + width * (leftward ? -0.17 : 0.17);
        if (Math.min(x0, x1) > 6 && Math.max(x0, x1) < width - 6) {
          addObstacle({ type: "segment", x1: x0, y1: y, x2: x1, y2: y + 5, thickness: 6 });
        }
      }
    }
  } else if (BOARD_TYPE === "triangles") {
    const rows = 7;
    for (let row = 0; row < rows; row++) {
      const y = top + (row + 0.5) * boardHeight / rows;
      const columns = 5 + row % 2;
      for (let column = 0; column < columns; column++) {
        const x = (column + (row % 2 ? 0.5 : 0.1)) * width / columns;
        if (x > 16 && x < width - 16) addPolygon(x, y, Math.max(13, Math.min(20, width * 0.048)), "triangle");
      }
    }
  } else if (BOARD_TYPE === "circles") {
    const rows = 10;
    for (let row = 0; row < rows; row++) {
      const y = top + (row + 0.5) * boardHeight / rows;
      const columns = 5 + row % 2;
      for (let column = 0; column < columns; column++) {
        const x = (column + (row % 2 ? 0.5 : 0.05)) * width / columns;
        if (x > 12 && x < width - 12) addObstacle({ type: "circle", cx: x, cy: y, radius: Math.max(6, Math.min(9, width * 0.023)) });
      }
    }
  } else if (BOARD_TYPE === "mixed") {
    const rows = 8;
    for (let row = 0; row < rows; row++) {
      const y = top + (row + 0.5) * boardHeight / rows;
      if (row % 2 === 0) {
        const columns = 5;
        for (let column = 0; column < columns; column++) {
          const x = (column + 0.5) * width / columns;
          addPolygon(x, y, Math.max(11, Math.min(17, width * 0.04)), "diamond");
        }
      } else {
        addObstacle({ type: "segment", x1: width * 0.12, y1: y, x2: width * 0.88, y2: y, thickness: 6 });
      }
    }
  } else {
    const count = 18;
    for (let index = 0; index < count; index++) {
      const cx = 24 + Math.random() * Math.max(1, width - 48);
      const cy = top + 20 + Math.random() * Math.max(1, boardHeight - 40);
      const kind = index % 4;
      if (kind === 0) addObstacle({ type: "circle", cx, cy, radius: 7 + Math.random() * 6 });
      else if (kind === 1) {
        const length = 42 + Math.random() * 48;
        const angle = Math.random() * Math.PI;
        addObstacle({ type: "segment", x1: cx - Math.cos(angle) * length / 2, y1: cy - Math.sin(angle) * length / 2, x2: cx + Math.cos(angle) * length / 2, y2: cy + Math.sin(angle) * length / 2, thickness: 5 });
      } else if (kind === 2) addPolygon(cx, cy, 16 + Math.random() * 12, "triangle");
      else addPolygon(cx, cy, 14 + Math.random() * 10, "diamond");
    }
  }

  const binWidth = width / MULTIPLIERS.length;
  for (let index = 0; index < MULTIPLIERS.length; index++) {
    bins.push({ x: index * binWidth, width: binWidth + 0.8, multiplier: MULTIPLIERS[index], color: BIN_COLORS[index] });
  }
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  width = Math.max(1, canvas.clientWidth || window.innerWidth);
  height = Math.max(1, canvas.clientHeight || window.innerHeight);
  canvas.width = Math.floor(width * dpr);
  canvas.height = Math.floor(height * dpr);
  context.setTransform(dpr, 0, 0, dpr, 0, 0);
  buildBoard();
  for (const ball of balls) {
    ball.x = Math.min(Math.max(ball.x, BALL_RADIUS), width - BALL_RADIUS);
    ball.y = Math.min(Math.max(ball.y, BALL_RADIUS), binTop - BALL_RADIUS);
  }
}

function reset() {
  balls = [];
  score = 0;
  started = false;
  spawnTimer = 0;
  feverActive = false;
  feverTimer = 0;
  nextFever = 12 + Math.random() * 8;
}

function spawnBall() {
  if (balls.length >= MAX_BALLS) return;
  balls.push({
    x: width / 2 + (Math.random() - 0.5) * width * 0.2,
    y: 18,
    vx: (Math.random() - 0.5) * 30,
    vy: 15,
    cooldown: COOLDOWN * 0.6
  });
}

function closestPointOnSegment(x, y, x1, y1, x2, y2) {
  const dx = x2 - x1;
  const dy = y2 - y1;
  const lengthSquared = dx * dx + dy * dy;
  const t = lengthSquared === 0 ? 0 : Math.min(1, Math.max(0, ((x - x1) * dx + (y - y1) * dy) / lengthSquared));
  return { x: x1 + dx * t, y: y1 + dy * t };
}

function pointInPolygon(x, y, points) {
  let inside = false;
  for (let i = 0, j = points.length - 1; i < points.length; j = i++) {
    if ((points[i].y > y) !== (points[j].y > y) && x < (points[j].x - points[i].x) * (y - points[i].y) / (points[j].y - points[i].y) + points[i].x) inside = !inside;
  }
  return inside;
}

function bounce(ball, normalX, normalY, overlap) {
  ball.x += normalX * overlap;
  ball.y += normalY * overlap;
  const normalVelocity = ball.vx * normalX + ball.vy * normalY;
  if (normalVelocity < 0) {
    const tangentX = -normalY;
    const tangentY = normalX;
    const tangentVelocity = ball.vx * tangentX + ball.vy * tangentY;
    const nextNormalVelocity = -normalVelocity * RESTITUTION;
    ball.vx = (tangentX * tangentVelocity + normalX * nextNormalVelocity) * FRICTION;
    ball.vy = (tangentY * tangentVelocity + normalY * nextNormalVelocity) * FRICTION;
  }
}

function collideObstacle(ball, obstacle) {
  if (ball.x + BALL_RADIUS < obstacle.minX || ball.x - BALL_RADIUS > obstacle.maxX || ball.y + BALL_RADIUS < obstacle.minY || ball.y - BALL_RADIUS > obstacle.maxY) return null;
  if (obstacle.type === "circle") {
    const dx = ball.x - obstacle.cx;
    const dy = ball.y - obstacle.cy;
    const distanceSquared = dx * dx + dy * dy;
    const hitDistance = BALL_RADIUS + obstacle.radius;
    if (distanceSquared >= hitDistance * hitDistance) return null;
    const distance = Math.sqrt(distanceSquared) || 0.001;
    const normalX = dx / distance;
    const normalY = dy / distance;
    bounce(ball, normalX, normalY, hitDistance - distance);
    return { x: normalX, y: normalY };
  }
  if (obstacle.type === "segment") {
    const point = closestPointOnSegment(ball.x, ball.y, obstacle.x1, obstacle.y1, obstacle.x2, obstacle.y2);
    const dx = ball.x - point.x;
    const dy = ball.y - point.y;
    const distanceSquared = dx * dx + dy * dy;
    const hitDistance = BALL_RADIUS + obstacle.thickness;
    if (distanceSquared >= hitDistance * hitDistance) return null;
    const distance = Math.sqrt(distanceSquared) || 0.001;
    const normalX = dx / distance;
    const normalY = dy / distance;
    bounce(ball, normalX, normalY, hitDistance - distance);
    return { x: normalX, y: normalY };
  }
  let nearest = null;
  let nearestDistanceSquared = Infinity;
  for (let i = 0, j = obstacle.points.length - 1; i < obstacle.points.length; j = i++) {
    const point = closestPointOnSegment(ball.x, ball.y, obstacle.points[j].x, obstacle.points[j].y, obstacle.points[i].x, obstacle.points[i].y);
    const dx = ball.x - point.x;
    const dy = ball.y - point.y;
    const distanceSquared = dx * dx + dy * dy;
    if (distanceSquared < nearestDistanceSquared) {
      nearestDistanceSquared = distanceSquared;
      nearest = point;
    }
  }
  const dx = ball.x - nearest.x;
  const dy = ball.y - nearest.y;
  const distance = Math.sqrt(nearestDistanceSquared) || 0.001;
  const inside = pointInPolygon(ball.x, ball.y, obstacle.points);
  const normalX = inside ? -dx / distance : dx / distance;
  const normalY = inside ? -dy / distance : dy / distance;
  if (!inside && distance >= BALL_RADIUS) return null;
  bounce(ball, normalX, normalY, inside ? BALL_RADIUS + distance : BALL_RADIUS - distance);
  return { x: normalX, y: normalY };
}

function split(parent, normalX, normalY) {
  if (parent.cooldown > 0) return;
  const count = FEVER_MODE && feverActive ? 3 : 1;
  if (balls.length + count > MAX_BALLS) return;
  for (let index = 0; index < count; index++) {
    const offset = BALL_RADIUS * (2.15 + index * 0.3);
    const childX = parent.x + normalX * offset;
    const childY = parent.y + normalY * offset;
    if (childX < BALL_RADIUS || childX > width - BALL_RADIUS || childY < 18 || childY > binTop - BALL_RADIUS) continue;
    balls.push({
      x: childX,
      y: childY,
      vx: parent.vx * 0.45 + normalX * (52 + index * 14),
      vy: parent.vy * 0.45 + normalY * (52 + index * 14),
      cooldown: COOLDOWN
    });
  }
  parent.cooldown = COOLDOWN;
}

function collideWalls(ball) {
  if (ball.x < BALL_RADIUS) {
    ball.x = BALL_RADIUS;
    ball.vx = Math.abs(ball.vx) * 0.7;
  } else if (ball.x > width - BALL_RADIUS) {
    ball.x = width - BALL_RADIUS;
    ball.vx = -Math.abs(ball.vx) * 0.7;
  }
  if (ball.y < 12 && ball.vy < 0) {
    ball.y = 12;
    ball.vy = 0;
  }
}

function updateFever(dt) {
  if (!FEVER_MODE) return;
  if (feverActive) {
    feverTimer -= dt;
    if (feverTimer <= 0) {
      feverActive = false;
      feverTimer = 0;
      nextFever = 12 + Math.random() * 8;
    }
  } else {
    nextFever -= dt;
    if (nextFever <= 0) {
      feverActive = true;
      feverTimer = FEVER_DURATION;
    }
  }
}

function update(dt) {
  updateFever(dt);
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnBall();
    spawnTimer = SPAWN_INTERVAL;
  }
  for (const ball of balls) ball.cooldown = Math.max(0, ball.cooldown - dt);
  const stepTime = dt / SUBSTEPS;
  for (let step = 0; step < SUBSTEPS; step++) {
    const count = balls.length;
    for (let index = 0; index < count; index++) {
      const ball = balls[index];
      ball.vy += GRAVITY * stepTime;
      const speed = Math.hypot(ball.vx, ball.vy);
      if (speed > MAX_SPEED) {
        ball.vx *= MAX_SPEED / speed;
        ball.vy *= MAX_SPEED / speed;
      }
      ball.x += ball.vx * stepTime;
      ball.y += ball.vy * stepTime;
      collideWalls(ball);
      for (const obstacle of obstacles) {
        const normal = collideObstacle(ball, obstacle);
        if (normal) split(ball, normal.x, normal.y);
      }
    }
  }
  for (let index = balls.length - 1; index >= 0; index--) {
    const ball = balls[index];
    if (ball.y >= binTop) {
      const binIndex = Math.min(MULTIPLIERS.length - 1, Math.max(0, Math.floor(ball.x / (width / MULTIPLIERS.length))));
      score += MULTIPLIERS[binIndex];
      balls.splice(index, 1);
    }
  }
}

function drawObstacles() {
  context.fillStyle = feverActive ? "#64325d" : "#394257";
  context.strokeStyle = context.fillStyle;
  context.lineWidth = 12;
  for (const obstacle of obstacles) {
    if (obstacle.type === "circle") {
      context.beginPath();
      context.arc(obstacle.cx, obstacle.cy, obstacle.radius, 0, Math.PI * 2);
      context.fill();
    } else if (obstacle.type === "segment") {
      context.beginPath();
      context.moveTo(obstacle.x1, obstacle.y1);
      context.lineTo(obstacle.x2, obstacle.y2);
      context.stroke();
    } else {
      context.beginPath();
      context.moveTo(obstacle.points[0].x, obstacle.points[0].y);
      for (let index = 1; index < obstacle.points.length; index++) context.lineTo(obstacle.points[index].x, obstacle.points[index].y);
      context.closePath();
      context.fill();
    }
  }
}

function drawScore() {
  const text = formatScore(score);
  let size = Math.min(width * 0.3, 150);
  context.textAlign = "center";
  context.textBaseline = "middle";
  do {
    context.font = `900 ${size}px system-ui, -apple-system, sans-serif`;
    if (context.measureText(text).width <= width * 0.94) break;
    size -= 4;
  } while (size > 14);
  context.fillStyle = feverActive ? "#ffe066" : "#f6f8ff";
  context.fillText(text, width / 2, Math.max(52, Math.min(height * 0.09, 80)), width * 0.96);
}

function draw() {
  context.fillStyle = feverActive ? "#170d14" : "#0a0c12";
  context.fillRect(0, 0, width, height);
  drawObstacles();
  for (const bin of bins) {
    context.fillStyle = bin.color;
    context.fillRect(bin.x, binTop, bin.width, height - binTop);
  }
  context.fillStyle = feverActive ? "#ff8ac4" : "#66d9ff";
  context.beginPath();
  for (const ball of balls) {
    context.moveTo(ball.x + BALL_RADIUS, ball.y);
    context.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
  }
  context.fill();
  drawScore();
}

function loop(now) {
  if (!lastFrameTime) lastFrameTime = now;
  const dt = Math.min((now - lastFrameTime) / 1000, 1 / 30);
  lastFrameTime = now;
  if (started) update(dt);
  draw();
  requestAnimationFrame(loop);
}

canvas.addEventListener("pointerdown", event => {
  event.preventDefault();
  const now = performance.now() / 1000;
  if (now - lastTapTime <= DOUBLE_TAP_WINDOW) {
    reset();
    lastTapTime = -1;
    return;
  }
  lastTapTime = now;
  if (!started) {
    started = true;
    spawnTimer = 0;
  }
});
canvas.addEventListener("contextmenu", event => event.preventDefault());
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 80));

resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
