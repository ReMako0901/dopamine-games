<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>タップ開花</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #08060d; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; background: #08060d; }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";

const canvas = document.getElementById("game");
const context = canvas.getContext("2d", { alpha: false });
const MAX_BALLS = 240;
const TAP_BALLS = 12;
const MAX_GENERATION = 3;
const DOUBLE_TAP_WINDOW = 0.3;

let width = 1;
let height = 1;
let balls = [];
let score = 0;
let lastFrameTime = 0;
let lastTapTime = -1;
let pendingTap = null;

function formatScore(value) {
  return Math.floor(value).toLocaleString("en-US");
}

function createBall(x, y, angle, speed, generation) {
  score++;
  return {
    x,
    y,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    generation,
    radius: Math.max(3.5, 11 - generation * 2),
    color: ["#ffd166", "#ff7b9c", "#7bd1ff", "#b8ff7b"][generation]
  };
}

function reset() {
  balls = [];
  score = 0;
  pendingTap = null;
}

function resize() {
  const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
  width = Math.max(1, canvas.clientWidth || window.innerWidth);
  height = Math.max(1, canvas.clientHeight || window.innerHeight);
  canvas.width = Math.floor(width * pixelRatio);
  canvas.height = Math.floor(height * pixelRatio);
  context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
}

function bloom(x, y) {
  const firstAngle = Math.random() * Math.PI * 2;
  for (let index = 0; index < TAP_BALLS; index++) {
    if (balls.length >= MAX_BALLS) return;
    const angle = firstAngle + index * (Math.PI * 2 / TAP_BALLS);
    balls.push(createBall(x, y, angle, 210 + Math.random() * 50, 0));
  }
}

function updateBalls(dt) {
  for (let index = balls.length - 1; index >= 0; index--) {
    const ball = balls[index];
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    let bounced = false;
    if (ball.x < ball.radius) {
      ball.x = ball.radius;
      ball.vx = Math.abs(ball.vx);
      bounced = true;
    } else if (ball.x > width - ball.radius) {
      ball.x = width - ball.radius;
      ball.vx = -Math.abs(ball.vx);
      bounced = true;
    }
    if (ball.y < ball.radius) {
      ball.y = ball.radius;
      ball.vy = Math.abs(ball.vy);
      bounced = true;
    } else if (ball.y > height - ball.radius) {
      ball.y = height - ball.radius;
      ball.vy = -Math.abs(ball.vy);
      bounced = true;
    }

    if (bounced && ball.generation < MAX_GENERATION) {
      for (let childIndex = 0; childIndex < 2 && balls.length < MAX_BALLS; childIndex++) {
        const angle = Math.atan2(ball.vy, ball.vx) + (childIndex === 0 ? -1.1 : 1.1);
        const child = createBall(ball.x, ball.y, angle, 155 + Math.random() * 35, ball.generation + 1);
        child.vx += ball.vx * 0.2;
        child.vy += ball.vy * 0.2;
        balls.push(child);
      }
    }
  }
}

function drawScore() {
  const text = formatScore(score);
  let size = Math.min(height * 0.24, 190);
  context.textAlign = "center";
  context.textBaseline = "middle";
  context.font = "900 " + size + "px system-ui, -apple-system, sans-serif";
  const maxWidth = width * 0.94;
  const measuredWidth = context.measureText(text).width;
  if (measuredWidth > maxWidth) {
    size = Math.max(20, size * maxWidth / measuredWidth);
    context.font = "900 " + size + "px system-ui, -apple-system, sans-serif";
  }
  context.fillStyle = "#f4f8ff";
  context.fillText(text, width / 2, height / 2);
}

function draw() {
  context.fillStyle = "#08060d";
  context.fillRect(0, 0, width, height);
  for (const ball of balls) {
    context.fillStyle = ball.color;
    context.beginPath();
    context.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    context.fill();
  }
  drawScore();
}

function update(timestamp) {
  if (!lastFrameTime) lastFrameTime = timestamp;
  const dt = Math.min(0.033, (timestamp - lastFrameTime) / 1000);
  lastFrameTime = timestamp;
  if (pendingTap !== null) {
    pendingTap.delay -= dt;
    if (pendingTap.delay <= 0) {
      bloom(pendingTap.x, pendingTap.y);
      pendingTap = null;
    }
  }
  if (dt > 0) updateBalls(dt);
  draw();
  requestAnimationFrame(update);
}

canvas.addEventListener("pointerdown", event => {
  event.preventDefault();
  const now = performance.now() / 1000;
  if (now - lastTapTime <= DOUBLE_TAP_WINDOW) {
    reset();
    lastTapTime = -1;
  } else {
    lastTapTime = now;
    pendingTap = { x: event.clientX, y: event.clientY, delay: DOUBLE_TAP_WINDOW };
  }
});
canvas.addEventListener("contextmenu", event => event.preventDefault());
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", resize);
document.addEventListener("visibilitychange", () => { lastFrameTime = 0; });

resize();
reset();
requestAnimationFrame(update);
</script>
</body>
</html>
