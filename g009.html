<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>受け皿キャッチ</title>
  <style>
    html, body { margin: 0; height: 100%; background: #080a10; overflow: hidden; overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; background: #080a10; }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";

const canvas = document.getElementById("game");
const context = canvas.getContext("2d", { alpha: false });
const FALLING_MAX = 14;
const BOUNCE_MAX = 90;
const BALL_RADIUS = 7;
const GRAVITY = 620;
const DOUBLE_TAP_WINDOW = 320;

let width = 1;
let height = 1;
let fallingBalls = [];
let bouncingBalls = [];
let trayX = 0;
let caughtCount = 0n;
let spawnTimer = 0;
let lastTapTime = -DOUBLE_TAP_WINDOW;
let lastFrameTime = 0;

function formatBigInt(value) {
  return value.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

function resize() {
  const devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
  width = Math.max(1, canvas.clientWidth || window.innerWidth);
  height = Math.max(1, canvas.clientHeight || window.innerHeight);
  canvas.width = Math.floor(width * devicePixelRatio);
  canvas.height = Math.floor(height * devicePixelRatio);
  context.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  trayX = width / 2;
}

function spawnFallingBall() {
  if (fallingBalls.length >= FALLING_MAX) return;
  fallingBalls.push({
    x: 22 + Math.random() * Math.max(1, width - 44),
    y: 28,
    vy: 60 + Math.random() * 30,
    color: "#94b8ff"
  });
}

function reset() {
  fallingBalls = [];
  bouncingBalls = [];
  caughtCount = 0n;
  spawnTimer = 0;
  trayX = width / 2;
  spawnFallingBall();
}

function updateTray(delta) {
  const trayWidth = Math.max(72, Math.min(width * 0.26, 104));
  let targetX = width / 2;
  let nearestDistance = Infinity;
  for (const ball of fallingBalls) {
    if (ball.y > height * 0.25) {
      const distance = Math.abs(ball.x - trayX);
      if (distance < nearestDistance) {
        nearestDistance = distance;
        targetX = ball.x;
      }
    }
  }
  const maximumSpeed = width * 1.25;
  const difference = targetX - trayX;
  trayX += Math.max(-maximumSpeed * delta, Math.min(maximumSpeed * delta, difference));
  trayX = Math.max(trayWidth / 2, Math.min(width - trayWidth / 2, trayX));
  return trayX;
}

function catchBall(ball, index) {
  fallingBalls.splice(index, 1);
  caughtCount += 1n;
  for (let side = -1; side <= 1; side += 2) {
    if (bouncingBalls.length >= BOUNCE_MAX) bouncingBalls.shift();
    bouncingBalls.push({
      x: ball.x + side * 6,
      y: height - 82,
      vx: side * (95 + Math.random() * 70),
      vy: -330 - Math.random() * 70,
      life: 0,
      color: ball.color
    });
  }
}

function update(delta) {
  const trayWidth = updateTray(delta);
  const trayY = height - 72;
  spawnTimer += delta;
  if (spawnTimer >= 1.05) {
    spawnTimer = 0;
    spawnFallingBall();
  }

  for (let index = fallingBalls.length - 1; index >= 0; index--) {
    const ball = fallingBalls[index];
    ball.vy += GRAVITY * 0.42 * delta;
    ball.y += ball.vy * delta;
    if (ball.y >= trayY && ball.y <= trayY + 20 && Math.abs(ball.x - trayX) <= trayWidth / 2 + BALL_RADIUS * 0.6) {
      catchBall(ball, index);
    } else if (ball.y > height + BALL_RADIUS) {
      fallingBalls.splice(index, 1);
    }
  }

  for (let index = bouncingBalls.length - 1; index >= 0; index--) {
    const ball = bouncingBalls[index];
    ball.life += delta;
    ball.vy += GRAVITY * delta;
    ball.x += ball.vx * delta;
    ball.y += ball.vy * delta;
    if (ball.x < BALL_RADIUS) {
      ball.x = BALL_RADIUS;
      ball.vx = Math.abs(ball.vx);
    } else if (ball.x > width - BALL_RADIUS) {
      ball.x = width - BALL_RADIUS;
      ball.vx = -Math.abs(ball.vx);
    }
    if (ball.y < BALL_RADIUS) {
      ball.y = BALL_RADIUS;
      ball.vy = Math.abs(ball.vy) * 0.82;
    } else if (ball.y > trayY - BALL_RADIUS && Math.abs(ball.x - trayX) <= trayWidth / 2 && ball.vy > 0) {
      ball.y = trayY - BALL_RADIUS;
      ball.vy = -Math.abs(ball.vy) * 0.78;
    }
    if (ball.life > 5.5 || ball.y > height + BALL_RADIUS) bouncingBalls.splice(index, 1);
  }
}

function drawNumber(value) {
  const text = formatBigInt(value);
  let size = Math.min(width * 0.30, height * 0.25);
  const maxWidth = width * 0.92;
  do {
    context.font = `700 ${size}px "Helvetica Neue", Arial, sans-serif`;
    if (context.measureText(text).width <= maxWidth) break;
    size *= 0.88;
  } while (size > 9);
  context.textAlign = "center";
  context.textBaseline = "middle";
  context.fillStyle = "#eef3ff";
  context.fillText(text, width / 2, height * 0.16);
}

function frame(now) {
  if (!lastFrameTime) lastFrameTime = now;
  const delta = Math.min((now - lastFrameTime) / 1000, 0.035);
  lastFrameTime = now;
  update(delta);

  context.fillStyle = "#080a10";
  context.fillRect(0, 0, width, height);
  const trayWidth = Math.max(72, Math.min(width * 0.26, 104));
  const trayY = height - 72;
  context.fillStyle = "#5f799f";
  context.fillRect(trayX - trayWidth / 2, trayY, trayWidth, 10);
  context.fillStyle = "#93a8c8";
  context.fillRect(trayX - trayWidth / 2, trayY + 10, trayWidth, 4);

  for (const ball of fallingBalls) {
    context.beginPath();
    context.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
    context.fillStyle = ball.color;
    context.fill();
  }
  for (const ball of bouncingBalls) {
    context.beginPath();
    context.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
    context.fillStyle = ball.color;
    context.fill();
  }
  drawNumber(caughtCount);
  requestAnimationFrame(frame);
}

canvas.addEventListener("pointerdown", (event) => {
  event.preventDefault();
  const now = performance.now();
  if (now - lastTapTime < DOUBLE_TAP_WINDOW) {
    reset();
    lastTapTime = -DOUBLE_TAP_WINDOW;
  } else {
    lastTapTime = now;
    spawnFallingBall();
  }
}, { passive: false });

window.addEventListener("resize", resize);
window.addEventListener("orientationchange", resize);

resize();
reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
