<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>跳ね台連鎖</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #05070c; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; background: #05070c; }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";

const canvas = document.getElementById("game");
const context = canvas.getContext("2d", { alpha: false });
const MAX_BALLS = 220;
const DOUBLE_TAP_WINDOW = 320;

let width = 1;
let height = 1;
let balls = [];
let score = 0;
let bedFlash = 0;
let lastTapTime = -DOUBLE_TAP_WINDOW;
let lastFrameTime = 0;

function formatScore(value) {
  return value.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

function createBall(x) {
  return { x, y: height * 0.06, vy: 0, vx: (Math.random() - 0.5) * 20, color: "#ffe066" };
}

function reset() {
  balls = [];
  score = 0;
  bedFlash = 0;
  balls.push(createBall(width * 0.5));
}

function resize() {
  const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
  width = Math.max(1, canvas.clientWidth || window.innerWidth);
  height = Math.max(1, canvas.clientHeight || window.innerHeight);
  canvas.width = Math.floor(width * pixelRatio);
  canvas.height = Math.floor(height * pixelRatio);
  context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
}

function bounce(ball) {
  ball.y = height * 0.77;
  ball.vy = -height * (0.82 + Math.random() * 0.18);
  ball.vx = (Math.random() - 0.5) * width * 0.1;
  score++;
  bedFlash = 0.15;
  if (balls.length < MAX_BALLS) {
    const child = createBall(ball.x + (Math.random() - 0.5) * 24);
    child.y = ball.y;
    child.vy = ball.vy * 1.05;
    child.vx = ball.vx * 1.4;
    child.color = "#78c2ff";
    balls.push(child);
  }
}

function update(delta) {
  for (const ball of balls) {
    ball.vy += height * 1.55 * delta;
    ball.x += ball.vx * delta;
    ball.y += ball.vy * delta;
    if (ball.x < 7) {
      ball.x = 7;
      ball.vx = Math.abs(ball.vx);
    } else if (ball.x > width - 7) {
      ball.x = width - 7;
      ball.vx = -Math.abs(ball.vx);
    }
    if (ball.y >= height * 0.77 && ball.vy > 0) bounce(ball);
  }
  bedFlash = Math.max(0, bedFlash - delta);
}

function drawNumber(value) {
  const text = formatScore(value);
  let size = Math.min(width * 0.26, height * 0.2);
  const maxWidth = width * 0.9;
  do {
    context.font = `900 ${size}px "Helvetica Neue", Arial, sans-serif`;
    if (context.measureText(text).width <= maxWidth) break;
    size *= 0.88;
  } while (size > 9);
  context.textAlign = "center";
  context.textBaseline = "middle";
  context.fillStyle = "#edf4ff";
  context.fillText(text, width / 2, height * 0.42);
}

function frame(now) {
  if (!lastFrameTime) lastFrameTime = now;
  const delta = Math.min((now - lastFrameTime) / 1000, 0.035);
  lastFrameTime = now;
  update(delta);

  context.fillStyle = "#05070c";
  context.fillRect(0, 0, width, height);
  const bedY = height * 0.8;
  context.fillStyle = bedFlash > 0 ? "#ffffff" : "#6a85a8";
  context.fillRect(width * 0.14, bedY, width * 0.72, 14);
  context.fillStyle = "#42576f";
  context.fillRect(width * 0.18, bedY + 14, width * 0.64, 18);

  for (const ball of balls) {
    context.beginPath();
    context.arc(ball.x, ball.y, 7, 0, Math.PI * 2);
    context.fillStyle = ball.color;
    context.fill();
  }
  drawNumber(score);
  requestAnimationFrame(frame);
}

canvas.addEventListener("pointerdown", (event) => {
  event.preventDefault();
  const now = performance.now();
  if (now - lastTapTime < DOUBLE_TAP_WINDOW) {
    reset();
    lastTapTime = -DOUBLE_TAP_WINDOW;
  } else {
    lastTapTime = now;
    if (balls.length < MAX_BALLS) balls.push(createBall(width * (0.2 + Math.random() * 0.6)));
  }
}, { passive: false });

window.addEventListener("resize", resize);
window.addEventListener("orientationchange", resize);
resize();
reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
