<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ペグ落下</title>
<style>
html,body{margin:0;height:100%;background:#080f14;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100vw;height:100vh;height:100dvh;background:#080f14}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";
const canvas=document.getElementById("game"),context=canvas.getContext("2d",{alpha:false});
let width=393,height=852,dpr=1;
const balls=[],pegs=[],trays=[];
let score=0,lastTap=0,lastTime=0,spawnTimer=0;

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  width=Math.max(1,canvas.clientWidth||window.innerWidth);
  height=Math.max(1,canvas.clientHeight||window.innerHeight);
  canvas.width=Math.floor(width*dpr);canvas.height=Math.floor(height*dpr);
  context.setTransform(dpr,0,0,dpr,0,0);
}

function reset(){
  balls.length=0;pegs.length=0;trays.length=0;score=0;spawnTimer=0;
  const rows=6,cols=5,padding=width*0.08,stepX=(width-padding*2)/(cols-1),stepY=height*0.065;
  for(let row=0;row<rows;row++)for(let col=0;col<cols;col++){
    const x=padding+col*stepX+(row%2?stepX*0.5:0);
    if(x>width-padding)continue;
    pegs.push({x,y:height*0.22+row*stepY,r:Math.max(6,width*0.016),hit:0});
  }
  const values=[1,2,3,5,10,20,50],trayW=width/values.length,trayH=height*0.07;
  values.forEach((value,index)=>trays.push({x:index*trayW,y:height-trayH,w:trayW,h:trayH,value}));
}

function spawn(){
  if(balls.length>=500)return;
  balls.push({x:width*(0.25+Math.random()*0.5),y:-10,r:Math.max(6,width*0.015),vx:(Math.random()-0.5)*40,vy:70});
}

function update(delta){
  spawnTimer-=delta;
  if(spawnTimer<=0){spawn();spawnTimer=0.55;}
  for(let i=balls.length-1;i>=0;i--){
    const ball=balls[i];
    ball.vy+=300*delta;ball.x+=ball.vx*delta;ball.y+=ball.vy*delta;
    if(ball.x-ball.r<0){ball.x=ball.r;ball.vx=Math.abs(ball.vx);}
    if(ball.x+ball.r>width){ball.x=width-ball.r;ball.vx=-Math.abs(ball.vx);}
    for(const peg of pegs){
      const dx=ball.x-peg.x,dy=ball.y-peg.y,distance=Math.hypot(dx,dy),sum=ball.r+peg.r;
      if(distance<sum&&distance>0){
        const nx=dx/distance,ny=dy/distance;
        ball.x=peg.x+nx*sum;ball.y=peg.y+ny*sum;
        const dot=ball.vx*nx+ball.vy*ny;
        if(dot<0){ball.vx-=1.75*dot*nx;ball.vy-=1.75*dot*ny;}
        if(peg.hit<=0){
          peg.hit=0.12;
          if(balls.length<500)balls.push({x:ball.x,y:ball.y,r:ball.r,vx:-ball.vx*0.35,vy:Math.min(ball.vy,60)});
        }
      }
    }
    if(ball.y+ball.r>=height){
      const tray=trays.find(item=>ball.x>=item.x&&ball.x<item.x+item.w);
      if(tray)score+=tray.value;
      balls.splice(i,1);
    }
  }
  for(const peg of pegs)if(peg.hit>0)peg.hit-=delta;
}

function drawNumber(value){
  const text=value.toLocaleString("ja-JP");
  let size=Math.min(width*0.32,170);
  context.font="900 "+size+"px system-ui,sans-serif";
  while(context.measureText(text).width>width*0.92&&size>18){
    size-=Math.max(2,size*0.06);
    context.font="900 "+size+"px system-ui,sans-serif";
  }
  context.textAlign="center";context.textBaseline="middle";
  context.fillStyle="rgba(255,255,255,0.93)";
  context.fillText(text,width*0.5,height*0.45);
}

function draw(){
  context.clearRect(0,0,width,height);
  for(const tray of trays){
    context.fillStyle=tray.value>=20?"#d94c5f":tray.value>=5?"#e0a23b":"#31536d";
    context.fillRect(tray.x,tray.y,tray.w-2,tray.h);
    context.fillStyle="#eaf3ff";
    context.font="800 "+Math.max(12,width*0.038)+"px system-ui,sans-serif";
    context.textAlign="center";context.textBaseline="middle";
    context.fillText("×"+tray.value,tray.x+tray.w/2,tray.y+tray.h/2);
  }
  context.fillStyle="#eaf3ff";
  for(const peg of pegs){context.beginPath();context.arc(peg.x,peg.y,peg.r,0,Math.PI*2);context.fill();}
  context.fillStyle="#7ee3ff";
  for(const ball of balls){context.beginPath();context.arc(ball.x,ball.y,ball.r,0,Math.PI*2);context.fill();}
  drawNumber(score);
}

function loop(now){
  const delta=Math.min((now-lastTime)/1000,1/30);lastTime=now;
  update(delta);draw();requestAnimationFrame(loop);
}

canvas.addEventListener("pointerdown",event=>{
  event.preventDefault();
  const now=performance.now();
  if(now-lastTap<300){reset();lastTap=0;return;}
  lastTap=now;
});
canvas.addEventListener("contextmenu",event=>event.preventDefault());
window.addEventListener("resize",()=>{resize();reset();});
resize();reset();lastTime=performance.now();requestAnimationFrame(loop);
</script>
</body>
</html>
