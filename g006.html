<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>放置数字</title>
  <style>
    html, body { margin: 0; height: 100%; background: #08090d; overflow: hidden; overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; background: #08090d; }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";

const canvas = document.getElementById("game");
const context = canvas.getContext("2d", { alpha: false });
const SAVE_KEY = "dopamine-g006-idle";
const COMPOUND_SECONDS = 30;
const DOUBLE_TAP_WINDOW = 320;

let width = 1;
let height = 1;
let score = 0n;
let rate = 1n;
let growthTimer = 0;
let lastTapTime = -DOUBLE_TAP_WINDOW;
let lastFrameTime = 0;
let pulse = 0;
let saveTimer = 0;

function formatBigInt(value) {
  return value.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

function resize() {
  const devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
  width = Math.max(1, canvas.clientWidth || window.innerWidth);
  height = Math.max(1, canvas.clientHeight || window.innerHeight);
  canvas.width = Math.floor(width * devicePixelRatio);
  canvas.height = Math.floor(height * devicePixelRatio);
  context.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}

function applyElapsedSeconds(seconds) {
  const elapsed = Math.max(0, seconds);
  const wholeSeconds = BigInt(Math.floor(elapsed));
  if (wholeSeconds > 0n) score += rate * wholeSeconds;

  const totalTimer = growthTimer + elapsed;
  const cycles = Math.floor(totalTimer / COMPOUND_SECONDS);
  growthTimer = totalTimer % COMPOUND_SECONDS;
  if (cycles > 0) rate *= 2n ** BigInt(cycles);
}

function saveState() {
  const savedAt = Date.now();
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      score: score.toString(),
      rate: rate.toString(),
      growthTimer,
      savedAt
    }));
  } catch (error) {
  }
}

function loadState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    const state = JSON.parse(raw);
    if (typeof state.score !== "string" || typeof state.rate !== "string") return;
    score = BigInt(state.score);
    rate = BigInt(state.rate);
    growthTimer = Number(state.growthTimer) || 0;
    const savedAt = Number(state.savedAt);
    if (Number.isFinite(savedAt)) applyElapsedSeconds(Math.max(0, (Date.now() - savedAt) / 1000));
  } catch (error) {
    score = 0n;
    rate = 1n;
    growthTimer = 0;
  }
}

function reset() {
  score = 0n;
  rate = 1n;
  growthTimer = 0;
  pulse = 1;
  saveState();
}

function onTap() {
  score += rate * 5n;
  pulse = 1;
}

function drawNumber() {
  const text = formatBigInt(score);
  let size = Math.min(width * 0.30, height * 0.26);
  const maxWidth = width * 0.92;
  do {
    context.font = `700 ${size}px "Helvetica Neue", Arial, sans-serif`;
    if (context.measureText(text).width <= maxWidth) break;
    size *= 0.88;
  } while (size > 9);

  context.font = `700 ${size * (1 + pulse * 0.035)}px "Helvetica Neue", Arial, sans-serif`;
  context.textAlign = "center";
  context.textBaseline = "middle";
  context.fillStyle = pulse > 0.12 ? "#f5f7ff" : "#d9e2ff";
  context.fillText(text, width / 2, height / 2);
}

function frame(now) {
  if (!lastFrameTime) lastFrameTime = now;
  const delta = Math.min((now - lastFrameTime) / 1000, 0.25);
  lastFrameTime = now;
  applyElapsedSeconds(delta);
  pulse = Math.max(0, pulse - delta * 3);

  saveTimer += delta;
  if (saveTimer >= 1) {
    saveTimer = 0;
    saveState();
  }

  context.fillStyle = "#08090d";
  context.fillRect(0, 0, width, height);
  context.beginPath();
  context.arc(width / 2, height / 2, Math.min(width, height) * (0.24 + pulse * 0.035), 0, Math.PI * 2);
  context.strokeStyle = "#242b45";
  context.lineWidth = 3;
  context.stroke();
  drawNumber();
  requestAnimationFrame(frame);
}

canvas.addEventListener("pointerdown", (event) => {
  event.preventDefault();
  const now = performance.now();
  if (now - lastTapTime < DOUBLE_TAP_WINDOW) {
    reset();
    lastTapTime = -DOUBLE_TAP_WINDOW;
  } else {
    lastTapTime = now;
    onTap();
  }
}, { passive: false });

window.addEventListener("resize", resize);
window.addEventListener("orientationchange", resize);
window.addEventListener("beforeunload", saveState);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) saveState();
});

resize();
loadState();
requestAnimationFrame(frame);
</script>
</body>
</html>
