<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>群れ分裂</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #04060b; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; background: #04060b; }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";

const canvas = document.getElementById("game");
const context = canvas.getContext("2d", { alpha: false });
const MAX_BALLS = 360;
const DOUBLE_TAP_WINDOW = 320;
const COLORS = ["#ffe066", "#7ce8b5", "#78c2ff", "#ff9aa8"];

let width = 1;
let height = 1;
let balls = [];
let lastTapTime = -DOUBLE_TAP_WINDOW;
let lastFrameTime = 0;

function formatScore(value) {
  return value.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

function createBall(x, y, angle) {
  const speed = 88 + Math.random() * 48;
  return {
    x,
    y,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    color: COLORS[Math.floor(Math.random() * COLORS.length)]
  };
}

function reset() {
  balls = [];
  for (let index = 0; index < 9; index++) {
    balls.push(createBall(width * (0.2 + Math.random() * 0.6), height * (0.2 + Math.random() * 0.6), Math.random() * Math.PI * 2));
  }
}

function resize() {
  const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
  width = Math.max(1, canvas.clientWidth || window.innerWidth);
  height = Math.max(1, canvas.clientHeight || window.innerHeight);
  canvas.width = Math.floor(width * pixelRatio);
  canvas.height = Math.floor(height * pixelRatio);
  context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
}

function splitAt(x, y, normalX, normalY) {
  if (balls.length >= MAX_BALLS) return;
  const baseAngle = Math.atan2(normalY, normalX);
  const angle = baseAngle + (Math.random() - 0.5) * 1.3;
  balls.push(createBall(x, y, angle));
}

function update(delta) {
  const neighborDistance = 52;
  for (const ball of balls) {
    let cohesionX = 0;
    let cohesionY = 0;
    let alignmentX = 0;
    let alignmentY = 0;
    let separationX = 0;
    let separationY = 0;
    let neighborCount = 0;
    for (const other of balls) {
      if (other === ball) continue;
      const dx = other.x - ball.x;
      const dy = other.y - ball.y;
      const distance = Math.hypot(dx, dy);
      if (distance > 70) continue;
      neighborCount++;
      cohesionX += other.x;
      cohesionY += other.y;
      alignmentX += other.vx;
      alignmentY += other.vy;
      if (distance < neighborDistance && distance > 0) {
        separationX -= dx / distance;
        separationY -= dy / distance;
      }
    }
    if (neighborCount > 0) {
      cohesionX = cohesionX / neighborCount - ball.x;
      cohesionY = cohesionY / neighborCount - ball.y;
      alignmentX = alignmentX / neighborCount - ball.vx;
      alignmentY = alignmentY / neighborCount - ball.vy;
      ball.vx += (cohesionX * 0.09 + alignmentX * 0.18 + separationX * 48) * delta;
      ball.vy += (cohesionY * 0.09 + alignmentY * 0.18 + separationY * 48) * delta;
    }
    const speed = Math.hypot(ball.vx, ball.vy);
    if (speed > 155) {
      ball.vx *= 155 / speed;
      ball.vy *= 155 / speed;
    } else if (speed < 65 && speed > 0) {
      ball.vx *= 65 / speed;
      ball.vy *= 65 / speed;
    }
    ball.x += ball.vx * delta;
    ball.y += ball.vy * delta;
    if (ball.x <= 7) {
      ball.x = 7;
      ball.vx = Math.abs(ball.vx);
      splitAt(ball.x, ball.y, 1, 0);
    } else if (ball.x >= width - 7) {
      ball.x = width - 7;
      ball.vx = -Math.abs(ball.vx);
      splitAt(ball.x, ball.y, -1, 0);
    }
    if (ball.y <= 7) {
      ball.y = 7;
      ball.vy = Math.abs(ball.vy);
      splitAt(ball.x, ball.y, 0, 1);
    } else if (ball.y >= height - 7) {
      ball.y = height - 7;
      ball.vy = -Math.abs(ball.vy);
      splitAt(ball.x, ball.y, 0, -1);
    }
  }
}

function drawNumber(value) {
  const text = formatScore(value);
  let size = Math.min(width * 0.26, height * 0.2);
  const maxWidth = width * 0.9;
  do {
    context.font = `900 ${size}px "Helvetica Neue", Arial, sans-serif`;
    if (context.measureText(text).width <= maxWidth) break;
    size *= 0.88;
  } while (size > 9);
  context.textAlign = "center";
  context.textBaseline = "middle";
  context.fillStyle = "#eef4ff";
  context.fillText(text, width / 2, height * 0.48);
}

function frame(now) {
  if (!lastFrameTime) lastFrameTime = now;
  const delta = Math.min((now - lastFrameTime) / 1000, 0.035);
  lastFrameTime = now;
  update(delta);

  context.fillStyle = "#04060b";
  context.fillRect(0, 0, width, height);
  for (const ball of balls) {
    context.beginPath();
    context.arc(ball.x, ball.y, 6, 0, Math.PI * 2);
    context.fillStyle = ball.color;
    context.fill();
  }
  drawNumber(balls.length);
  requestAnimationFrame(frame);
}

canvas.addEventListener("pointerdown", (event) => {
  event.preventDefault();
  const now = performance.now();
  if (now - lastTapTime < DOUBLE_TAP_WINDOW) {
    reset();
    lastTapTime = -DOUBLE_TAP_WINDOW;
  } else {
    lastTapTime = now;
    if (balls.length < MAX_BALLS) balls.push(createBall(width * (0.15 + Math.random() * 0.7), height * (0.15 + Math.random() * 0.7), Math.random() * Math.PI * 2));
  }
}, { passive: false });

window.addEventListener("resize", resize);
window.addEventListener("orientationchange", resize);
resize();
reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
