<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>タワースタック</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #05070d; overflow: hidden; overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; background: #05070d; }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";

const canvas = document.getElementById("game");
const context = canvas.getContext("2d", { alpha: false });
const DOUBLE_TAP_WINDOW = 320;

let width = 1;
let height = 1;
let score = 0n;
let tower = [];
let current = null;
let level = 0;
let swayTime = 0;
let lastTapTime = -DOUBLE_TAP_WINDOW;
let lastFrameTime = 0;

function formatScore(value) {
  return value.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

function resize() {
  const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
  width = Math.max(1, canvas.clientWidth || window.innerWidth);
  height = Math.max(1, canvas.clientHeight || window.innerHeight);
  canvas.width = Math.floor(width * pixelRatio);
  canvas.height = Math.floor(height * pixelRatio);
  context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
}

function reset() {
  score = 0n;
  tower = [];
  level = 0;
  swayTime = 0;
  spawnCurrent();
}

function blockHeight() {
  return Math.max(24, Math.min(36, height * 0.045));
}

function towerTopY() {
  return height * 0.78 - tower.length * blockHeight();
}

function spawnCurrent() {
  const blockWidth = width * (level === 0 ? 0.52 : Math.max(0.16, 0.48 - level * 0.008));
  const parent = tower[tower.length - 1];
  const parentX = parent ? parent.x + parent.w / 2 : width / 2;
  current = {
    x: parentX,
    w: blockWidth,
    value: 1 + Math.floor(Math.random() * 5),
    y: towerTopY() - blockHeight() - Math.max(58, height * 0.08),
    vy: 0,
    falling: false
  };
}

function dropCurrent() {
  if (!current || current.falling) return;
  current.falling = true;
  current.vy = 130;
}

function landCurrent() {
  const top = tower[tower.length - 1];
  const currentLeft = current.x - current.w / 2;
  const currentRight = currentLeft + current.w;
  const topLeft = top ? top.x : width * 0.24;
  const topRight = topLeft + (top ? top.w : width * 0.52);
  const overlapLeft = Math.max(currentLeft, topLeft);
  const overlapRight = Math.min(currentRight, topRight);
  const overlap = overlapRight - overlapLeft;

  if (overlap < current.w * 0.18) return false;
  const landed = {
    x: overlapLeft,
    w: Math.max(14, overlap),
    value: current.value,
    y: towerTopY() - blockHeight()
  };
  tower.push(landed);
  score += BigInt((level + 1) * landed.value);
  level++;
  spawnCurrent();
  return true;
}

function update(delta) {
  swayTime += delta * (1.1 + Math.min(level * 0.05, 0.7));
  if (!current.falling) {
    const range = Math.max(46, width * 0.3 - level * 2);
    current.x = width / 2 + Math.sin(swayTime * 1.6) * range;
    return;
  }

  current.vy += 1650 * delta;
  current.y += current.vy * delta;
  const targetY = towerTopY() - blockHeight();
  if (current.y >= targetY) {
    if (!landCurrent()) {
      if (current.y > height + blockHeight()) {
        tower = [];
        level = 0;
        spawnCurrent();
      }
    }
  }
}

function drawNumber() {
  const text = formatScore(score);
  let size = Math.min(width * 0.26, height * 0.17);
  const maxWidth = width * 0.9;
  do {
    context.font = `900 ${size}px "Helvetica Neue", Arial, sans-serif`;
    if (context.measureText(text).width <= maxWidth) break;
    size *= 0.88;
  } while (size > 9);
  context.textAlign = "center";
  context.textBaseline = "middle";
  context.fillStyle = "#f2f7ff";
  context.fillText(text, width / 2, height * 0.16);
}

function drawBlock(x, y, w, h, value, active) {
  context.fillStyle = active ? "#ffd166" : "#5c7cfa";
  context.fillRect(x, y, w, h);
  context.fillStyle = active ? "#40310b" : "#dce8ff";
  context.font = `800 ${Math.max(10, Math.min(18, h * 0.5))}px Arial, sans-serif`;
  context.textAlign = "center";
  context.textBaseline = "middle";
  context.fillText(String(value), x + w / 2, y + h / 2);
}

function draw() {
  context.fillStyle = "#05070d";
  context.fillRect(0, 0, width, height);

  const block = blockHeight();
  let cameraY = 0;
  if (tower.length > 6) {
    const topY = towerTopY();
    const desiredTop = height * 0.34;
    if (topY < desiredTop) cameraY = desiredTop - topY;
  }

  context.save();
  context.translate(0, cameraY);
  context.fillStyle = "#20263a";
  context.fillRect(0, height * 0.78, width, height * 0.24);
  for (const item of tower) {
    drawBlock(item.x, item.y, item.w, block, item.value, false);
  }
  if (current) drawBlock(current.x - current.w / 2, current.y, current.w, block, current.value, true);
  context.restore();
  drawNumber();
}

function frame(now) {
  if (!lastFrameTime) lastFrameTime = now;
  const delta = Math.min((now - lastFrameTime) / 1000, 0.035);
  lastFrameTime = now;
  update(delta);
  draw();
  requestAnimationFrame(frame);
}

canvas.addEventListener("pointerdown", (event) => {
  event.preventDefault();
  const now = performance.now();
  if (now - lastTapTime < DOUBLE_TAP_WINDOW) {
    reset();
    lastTapTime = -DOUBLE_TAP_WINDOW;
  } else {
    lastTapTime = now;
    dropCurrent();
  }
}, { passive: false });

window.addEventListener("resize", () => {
  resize();
  reset();
});
window.addEventListener("orientationchange", () => {
  resize();
  reset();
});

resize();
reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
