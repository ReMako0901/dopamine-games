<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>鏡の部屋</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #04060b; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; background: #04060b; }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";

const canvas = document.getElementById("game");
const context = canvas.getContext("2d", { alpha: false });
const MAX_BALLS = 220;
const DOUBLE_TAP_WINDOW = 0.32;

let width = 1;
let height = 1;
let balls = [];
let score = 0;
let mirrors = [];
let lastFrameTime = 0;
let lastTapTime = -1;

function formatScore(value) {
  return Math.floor(value).toLocaleString("en-US");
}

function createBall(x, y, angle, speed) {
  return { x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, radius: 6 };
}

function reset() {
  balls = [];
  score = 0;
  const top = { x: width * 0.5, y: height * 0.1 };
  const right = { x: width * 0.9, y: height * 0.5 };
  const bottom = { x: width * 0.5, y: height * 0.9 };
  const left = { x: width * 0.1, y: height * 0.5 };
  mirrors = [
    { ax: top.x, ay: top.y, bx: right.x, by: right.y, flash: 0 },
    { ax: right.x, ay: right.y, bx: bottom.x, by: bottom.y, flash: 0 },
    { ax: bottom.x, ay: bottom.y, bx: left.x, by: left.y, flash: 0 },
    { ax: left.x, ay: left.y, bx: top.x, by: top.y, flash: 0 }
  ];
  for (let index = 0; index < 8; index++) {
    balls.push(createBall(width * 0.5, height * 0.5, index * (Math.PI / 4), 200 + Math.random() * 40));
  }
  score = balls.length;
}

function resize() {
  const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
  const oldWidth = width;
  const oldHeight = height;
  width = Math.max(1, canvas.clientWidth || window.innerWidth);
  height = Math.max(1, canvas.clientHeight || window.innerHeight);
  canvas.width = Math.floor(width * pixelRatio);
  canvas.height = Math.floor(height * pixelRatio);
  context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
  if (oldWidth !== width || oldHeight !== height) reset();
}

function reflectBall(ball, mirror) {
  const ex = mirror.bx - mirror.ax;
  const ey = mirror.by - mirror.ay;
  const lengthSquared = ex * ex + ey * ey;
  const t = Math.max(0, Math.min(1, ((ball.x - mirror.ax) * ex + (ball.y - mirror.ay) * ey) / lengthSquared));
  const px = mirror.ax + ex * t;
  const py = mirror.ay + ey * t;
  let dx = ball.x - px;
  let dy = ball.y - py;
  let distance = Math.hypot(dx, dy);
  if (distance >= ball.radius) return false;

  const edgeLength = Math.sqrt(lengthSquared);
  const edgeX = ex / edgeLength;
  const edgeY = ey / edgeLength;
  let normalX = -edgeY;
  let normalY = edgeX;
  if (normalX * (width / 2 - px) + normalY * (height / 2 - py) < 0) {
    normalX = -normalX;
    normalY = -normalY;
  }
  if (distance === 0) {
    dx = normalX;
    dy = normalY;
    distance = 1;
  }

  ball.x = px + normalX * (ball.radius + 0.5);
  ball.y = py + normalY * (ball.radius + 0.5);
  const dot = ball.vx * normalX + ball.vy * normalY;
  if (dot < 0) {
    ball.vx -= 2 * dot * normalX;
    ball.vy -= 2 * dot * normalY;
  }
  mirror.flash = 0.14;
  return true;
}

function updateBalls(dt) {
  const newBalls = [];
  for (const ball of balls) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    for (const mirror of mirrors) {
      if (reflectBall(ball, mirror) && balls.length + newBalls.length < MAX_BALLS) {
        const angle = Math.atan2(ball.vy, ball.vx) + (Math.random() * 2 - 1) * 0.75;
        newBalls.push(createBall(ball.x, ball.y, angle, 205 + Math.random() * 35));
      }
    }
  }
  balls.push(...newBalls);
  score = balls.length;
}

function drawScore() {
  const text = formatScore(score);
  let size = Math.min(height * 0.24, 190);
  context.textAlign = "center";
  context.textBaseline = "middle";
  context.font = "900 " + size + "px system-ui, -apple-system, sans-serif";
  const maxWidth = width * 0.94;
  const measuredWidth = context.measureText(text).width;
  if (measuredWidth > maxWidth) {
    size = Math.max(20, size * maxWidth / measuredWidth);
    context.font = "900 " + size + "px system-ui, -apple-system, sans-serif";
  }
  context.fillStyle = "#f4f8ff";
  context.fillText(text, width / 2, height / 2);
}

function draw() {
  context.fillStyle = "#04060b";
  context.fillRect(0, 0, width, height);
  context.lineCap = "round";
  context.lineWidth = 6;
  for (const mirror of mirrors) {
    context.strokeStyle = mirror.flash > 0 ? "#ffffff" : "#a8c7ff";
    context.beginPath();
    context.moveTo(mirror.ax, mirror.ay);
    context.lineTo(mirror.bx, mirror.by);
    context.stroke();
    mirror.flash -= 0.016;
  }

  context.fillStyle = "#ffe66d";
  for (const ball of balls) {
    context.beginPath();
    context.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    context.fill();
  }
  drawScore();
}

function update(timestamp) {
  if (!lastFrameTime) lastFrameTime = timestamp;
  const dt = Math.min(0.033, (timestamp - lastFrameTime) / 1000);
  lastFrameTime = timestamp;
  if (dt > 0) updateBalls(dt);
  draw();
  requestAnimationFrame(update);
}

canvas.addEventListener("pointerdown", event => {
  event.preventDefault();
  const now = performance.now() / 1000;
  if (now - lastTapTime <= DOUBLE_TAP_WINDOW) {
    reset();
    lastTapTime = -1;
  } else {
    lastTapTime = now;
  }
});
canvas.addEventListener("contextmenu", event => event.preventDefault());
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", resize);
document.addEventListener("visibilitychange", () => { lastFrameTime = 0; });

resize();
reset();
requestAnimationFrame(update);
</script>
</body>
</html>
