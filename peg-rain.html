<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>PEG RAIN</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #101018;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100dvh;
      background: #101018;
    }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";

const canvas = document.getElementById("game");
const context = canvas.getContext("2d", { alpha: false });

const MAX_BALLS = 800;
const PEG_RADIUS = 6.5;
const BALL_RADIUS = 8;
const SPLIT_COOLDOWN = 0.5;
const MIN_SPAWN_INTERVAL = 0.22;
const DOUBLE_TAP_WINDOW = 0.32;

const BIN_MULTIPLIERS = [1, 2, 5, 10, 5, 2, 1];
const BIN_COLORS = ["#34495e", "#2d6a4f", "#7b2d8b", "#b8860b", "#7b2d8b", "#2d6a4f", "#34495e"];
const BIN_TEXT_COLORS = ["#aab7c4", "#7ddba0", "#d29bf5", "#f5d76e", "#d29bf5", "#7ddba0", "#aab7c4"];

let width = 0;
let height = 0;
let pegs = [];
let bins = [];
let binTop = 0;
let balls = [];
let score = 0;
let elapsed = 0;
let spawnTimer = 0;
let lastTapTime = -1;
let lastFrameTime = 0;

function formatScore(value) {
  return String(value).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  width = Math.max(1, canvas.clientWidth || window.innerWidth);
  height = Math.max(1, canvas.clientHeight || window.innerHeight);
  canvas.width = Math.floor(width * dpr);
  canvas.height = Math.floor(height * dpr);
  context.setTransform(dpr, 0, 0, dpr, 0, 0);
  buildBoard();
}

function buildBoard() {
  pegs = [];
  bins = [];

  const scoreAreaHeight = Math.max(96, Math.min(height * 0.18, 150));
  const binHeight = Math.max(58, Math.min(height * 0.08, 82));
  binTop = height - binHeight;
  const boardTop = scoreAreaHeight + 24;
  const boardBottom = binTop - 34;
  const boardHeight = Math.max(140, boardBottom - boardTop);
  const spacing = Math.max(35, Math.min(width / 8.4, height / 15));
  const rowCount = Math.max(3, Math.floor((boardHeight - spacing * 0.5) / (spacing * 0.56)) + 1);

  for (let row = 0; row < rowCount; row++) {
    const y = boardTop + row * spacing * 0.56;
    if (y >= boardBottom) break;
    const offset = row % 2 === 0 ? 0 : spacing * 0.5;
    const columnCount = Math.ceil((width + spacing) / spacing);
    for (let column = -1; column <= columnCount; column++) {
      const x = column * spacing + offset;
      if (x >= PEG_RADIUS && x <= width - PEG_RADIUS) {
        pegs.push({ x, y, row, column });
      }
    }
  }

  const binWidth = width / BIN_MULTIPLIERS.length;
  for (let index = 0; index < BIN_MULTIPLIERS.length; index++) {
    bins.push({
      x: index * binWidth,
      width: binWidth,
      multiplier: BIN_MULTIPLIERS[index],
      color: BIN_COLORS[index],
      highlight: BIN_TEXT_COLORS[index]
    });
  }
}

function spawnBall(x, y) {
  if (balls.length >= MAX_BALLS) return;

  const safeX = Math.min(Math.max(x, BALL_RADIUS), width - BALL_RADIUS);
  const safeY = Math.min(Math.max(y, 20), Math.max(20, binTop - BALL_RADIUS - 1));
  balls.push({
    x: safeX,
    y: safeY,
    vx: 0,
    vy: 0,
    cooldown: SPLIT_COOLDOWN
  });
}

function splitBall(parent, normalX, normalY) {
  if (balls.length >= MAX_BALLS || parent.cooldown > 0) return;

  const childX = parent.x + normalX * BALL_RADIUS * 2.2;
  const childY = parent.y + normalY * BALL_RADIUS * 2.2;
  if (childX < BALL_RADIUS || childX > width - BALL_RADIUS) return;
  if (childY < 20 || childY > binTop - BALL_RADIUS) return;

  balls.push({
    x: childX,
    y: childY,
    vx: parent.vx * 0.45 - normalX * 35,
    vy: parent.vy * 0.45 - normalY * 35,
    cooldown: SPLIT_COOLDOWN
  });
  parent.cooldown = SPLIT_COOLDOWN;
  parent.vx *= 0.88;
  parent.vy *= 0.88;
}

function collideWithPegs(ball, dt) {
  const rowSpacing = Math.max(35, Math.min(width / 8.4, height / 15)) * 0.56;
  const possibleRows = 2;
  const nearestRow = Math.round((ball.y - getBoardTop()) / rowSpacing);

  for (const peg of pegs) {
    if (Math.abs(peg.row - nearestRow) > possibleRows) continue;

    const dx = ball.x - peg.x;
    const dy = ball.y - peg.y;
    const distanceSquared = dx * dx + dy * dy;
    const minimumDistance = BALL_RADIUS + PEG_RADIUS;
    if (distanceSquared >= minimumDistance * minimumDistance) continue;

    const distance = Math.sqrt(distanceSquared) || 0.001;
    const normalX = dx / distance;
    const normalY = dy / distance;
    const overlap = minimumDistance - distance;

    ball.x += normalX * overlap;
    ball.y += normalY * overlap;

    const velocityAlongNormal = ball.vx * normalX + ball.vy * normalY;
    if (velocityAlongNormal < 0) {
      const restitution = 0.58;
      const tangentX = -normalY;
      const tangentY = normalX;
      const tangentVelocity = ball.vx * tangentX + ball.vy * tangentY;
      const nextNormalVelocity = -velocityAlongNormal * restitution;
      ball.vx = tangentX * tangentVelocity + normalX * nextNormalVelocity;
      ball.vy = tangentY * tangentVelocity + normalY * nextNormalVelocity;
      ball.vx *= 0.96;
      ball.vy *= 0.96;
    }

    splitBall(ball, normalX, normalY);
  }
}

let cachedBoardTop = 0;
function getBoardTop() {
  return cachedBoardTop;
}

function updateBoardTop() {
  const scoreAreaHeight = Math.max(96, Math.min(height * 0.18, 150));
  cachedBoardTop = scoreAreaHeight + 24;
}

function update(dt) {
  elapsed += dt;
  spawnTimer -= dt;
  const spawnInterval = Math.max(MIN_SPAWN_INTERVAL, 1 - elapsed / 130);
  if (spawnTimer <= 0) {
    spawnBall(width / 2, 72);
    spawnTimer += spawnInterval;
    if (spawnTimer < 0) spawnTimer = 0;
  }

  updateBoardTop();
  const gravity = 900;
  const maxSpeed = 900;

  for (let index = balls.length - 1; index >= 0; index--) {
    const ball = balls[index];
    ball.cooldown = Math.max(0, ball.cooldown - dt);
    ball.vy += gravity * dt;
    ball.vx *= 1 - Math.min(1, 0.12 * dt);
    ball.vx = Math.min(Math.max(ball.vx, -maxSpeed), maxSpeed);
    ball.vy = Math.min(Math.max(ball.vy, -maxSpeed), maxSpeed);
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    if (ball.x < BALL_RADIUS) {
      ball.x = BALL_RADIUS;
      ball.vx = Math.abs(ball.vx) * 0.72;
    } else if (ball.x > width - BALL_RADIUS) {
      ball.x = width - BALL_RADIUS;
      ball.vx = -Math.abs(ball.vx) * 0.72;
    }

    if (ball.y < BALL_RADIUS && ball.vy < 0) {
      ball.y = BALL_RADIUS;
      ball.vy = 0;
    }

    collideWithPegs(ball, dt);

    if (ball.y >= binTop) {
      const binIndex = Math.min(BIN_MULTIPLIERS.length - 1, Math.max(0, Math.floor(ball.x / (width / BIN_MULTIPLIERS.length))));
      score += BIN_MULTIPLIERS[binIndex];
      balls.splice(index, 1);
    }
  }
}

function drawScore() {
  const text = formatScore(score);
  const maxWidth = width - 24;
  let fontSize = Math.max(56, Math.min(height * 0.17, 108));
  context.textAlign = "center";
  context.textBaseline = "middle";
  context.font = `900 ${fontSize}px system-ui, -apple-system, "Segoe UI", sans-serif`;

  while (fontSize > 18 && context.measureText(text).width > maxWidth) {
    fontSize -= 2;
    context.font = `900 ${fontSize}px system-ui, -apple-system, "Segoe UI", sans-serif`;
  }

  context.fillStyle = "#f2f6ff";
  context.fillText(text, width / 2, Math.max(52, Math.min(height * 0.09, 76)));
}

function draw() {
  context.fillStyle = "#101018";
  context.fillRect(0, 0, width, height);

  context.fillStyle = "#586574";
  for (const peg of pegs) {
    context.beginPath();
    context.arc(peg.x, peg.y, PEG_RADIUS, 0, Math.PI * 2);
    context.fill();
  }

  for (const bin of bins) {
    context.fillStyle = bin.color;
    context.fillRect(bin.x, binTop, bin.width + 0.7, height - binTop);
    context.fillStyle = bin.highlight;
    context.fillRect(bin.x, binTop, bin.width + 0.7, 4);
  }

  context.fillStyle = "#3ee7ff";
  context.beginPath();
  for (const ball of balls) {
    context.moveTo(ball.x + BALL_RADIUS, ball.y);
    context.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
  }
  context.fill();

  drawScore();
}

function frame(timestamp) {
  if (!lastFrameTime) lastFrameTime = timestamp;
  const dt = Math.min((timestamp - lastFrameTime) / 1000, 1 / 30);
  lastFrameTime = timestamp;

  update(dt);
  draw();
  requestAnimationFrame(frame);
}

canvas.addEventListener("pointerdown", (event) => {
  event.preventDefault();
  const now = performance.now() / 1000;

  if (lastTapTime >= 0 && now - lastTapTime <= DOUBLE_TAP_WINDOW) {
    balls.length = 0;
    score = 0;
    elapsed = 0;
    spawnTimer = 0;
    lastTapTime = -1;
    return;
  }

  lastTapTime = now;
  const rect = canvas.getBoundingClientRect();
  spawnBall(event.clientX - rect.left, event.clientY - rect.top);
}, { passive: false });

window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 80));
document.addEventListener("contextmenu", event => event.preventDefault());

resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
