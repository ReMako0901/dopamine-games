<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>玉の雨</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #07090f; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; background: #07090f; }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";

const canvas = document.getElementById("game");
const context = canvas.getContext("2d", { alpha: false });
const MAX_BALLS = 220;
const BASE_RADIUS = 13;
const GRAVITY = 180;
const SPAWN_INTERVAL = 0.1;
const DOUBLE_MIN = 8;
const DOUBLE_MAX = 14;
const DOUBLE_DURATION = 5;
const DOUBLE_TAP_WINDOW = 0.32;

let width = 1;
let height = 1;
let balls = [];
let score = 0;
let spawnTimer = 0;
let nextDouble = DOUBLE_MIN + Math.random() * (DOUBLE_MAX - DOUBLE_MIN);
let doubleTimer = 0;
let doubleActive = false;
let lastFrameTime = 0;
let lastTapTime = -1;

function formatScore(value) {
  return Math.floor(value).toLocaleString("en-US");
}

function createBall(x, generation) {
  const radius = Math.max(6, BASE_RADIUS - generation * 3);
  return { x, y: -radius, vx: (Math.random() * 2 - 1) * 25, vy: 35 + Math.random() * 45, generation, radius };
}

function reset() {
  balls = [];
  score = 0;
  spawnTimer = 0;
  doubleActive = false;
  doubleTimer = 0;
  nextDouble = DOUBLE_MIN + Math.random() * (DOUBLE_MAX - DOUBLE_MIN);
}

function resize() {
  const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
  width = Math.max(1, canvas.clientWidth || window.innerWidth);
  height = Math.max(1, canvas.clientHeight || window.innerHeight);
  canvas.width = Math.floor(width * pixelRatio);
  canvas.height = Math.floor(height * pixelRatio);
  context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
}

function updateDoubleRain(dt) {
  if (doubleActive) {
    doubleTimer -= dt;
    if (doubleTimer <= 0) {
      doubleActive = false;
      nextDouble = DOUBLE_MIN + Math.random() * (DOUBLE_MAX - DOUBLE_MIN);
    }
    return;
  }
  nextDouble -= dt;
  if (nextDouble <= 0) {
    doubleActive = true;
    doubleTimer = DOUBLE_DURATION;
  }
}

function updateRain(dt) {
  spawnTimer -= dt;
  while (spawnTimer <= 0) {
    if (balls.length < MAX_BALLS) {
      const margin = BASE_RADIUS + 5;
      balls.push(createBall(margin + Math.random() * Math.max(1, width - margin * 2), 0));
    }
    spawnTimer += SPAWN_INTERVAL;
  }

  const floor = height - 5;
  for (let index = balls.length - 1; index >= 0; index--) {
    const ball = balls[index];
    ball.vy += GRAVITY * dt;
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    if (ball.x < ball.radius) {
      ball.x = ball.radius;
      ball.vx = Math.abs(ball.vx);
    } else if (ball.x > width - ball.radius) {
      ball.x = width - ball.radius;
      ball.vx = -Math.abs(ball.vx);
    }

    if (ball.y >= floor - ball.radius) {
      score++;
      if (doubleActive && balls.length + 2 <= MAX_BALLS && ball.generation < 2) {
        const left = Math.min(width - 8, Math.max(8, ball.x - 34));
        const right = Math.min(width - 8, Math.max(8, ball.x + 34));
        balls.push(createBall(left, ball.generation + 1));
        balls.push(createBall(right, ball.generation + 1));
      }
      balls.splice(index, 1);
    }
  }
}

function drawScore() {
  const text = formatScore(score);
  let size = Math.min(height * 0.24, 190);
  context.textAlign = "center";
  context.textBaseline = "middle";
  context.font = "900 " + size + "px system-ui, -apple-system, sans-serif";
  const maxWidth = width * 0.94;
  const measuredWidth = context.measureText(text).width;
  if (measuredWidth > maxWidth) {
    size = Math.max(20, size * maxWidth / measuredWidth);
    context.font = "900 " + size + "px system-ui, -apple-system, sans-serif";
  }
  context.fillStyle = "#f4f8ff";
  context.fillText(text, width / 2, height / 2);
}

function draw() {
  context.fillStyle = "#07090f";
  context.fillRect(0, 0, width, height);
  for (const ball of balls) {
    context.fillStyle = doubleActive ? "#ffb84d" : "#49d8ff";
    context.beginPath();
    context.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    context.fill();
  }
  context.fillStyle = doubleActive ? "#ffb84d" : "#23304a";
  context.fillRect(0, height - 5, width, 5);
  drawScore();
}

function update(timestamp) {
  if (!lastFrameTime) lastFrameTime = timestamp;
  const dt = Math.min(0.033, (timestamp - lastFrameTime) / 1000);
  lastFrameTime = timestamp;
  if (dt > 0) {
    updateDoubleRain(dt);
    updateRain(dt);
  }
  draw();
  requestAnimationFrame(update);
}

canvas.addEventListener("pointerdown", event => {
  event.preventDefault();
  const now = performance.now() / 1000;
  if (now - lastTapTime <= DOUBLE_TAP_WINDOW) {
    reset();
    lastTapTime = -1;
  } else {
    lastTapTime = now;
  }
});
canvas.addEventListener("contextmenu", event => event.preventDefault());
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", resize);
document.addEventListener("visibilitychange", () => { lastFrameTime = 0; });

resize();
reset();
requestAnimationFrame(update);
</script>
</body>
</html>
