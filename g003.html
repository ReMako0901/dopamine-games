<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>連鎖爆発</title>
<style>
html,body{margin:0;height:100%;background:#100a0d;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100vw;height:100vh;height:100dvh;background:#100a0d}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";
const canvas=document.getElementById("game"),context=canvas.getContext("2d",{alpha:false});
let width=393,height=852,dpr=1;
const balls=[],rings=[];
let score=0,chain=0,lastTap=0,lastTime=0;

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  width=Math.max(1,canvas.clientWidth||window.innerWidth);
  height=Math.max(1,canvas.clientHeight||window.innerHeight);
  canvas.width=Math.floor(width*dpr);canvas.height=Math.floor(height*dpr);
  context.setTransform(dpr,0,0,dpr,0,0);
}

function spawnBall(){
  if(balls.length>=42)return;
  const angle=Math.random()*Math.PI*2,speed=32+Math.random()*55;
  balls.push({
    x:width*0.08+Math.random()*width*0.84,
    y:height*0.10+Math.random()*height*0.72,
    r:width*(0.035+Math.random()*0.026),
    vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed
  });
}

function reset(){
  balls.length=0;rings.length=0;score=0;chain=0;
  for(let i=0;i<16;i++)spawnBall();
}

function update(delta){
  while(balls.length<16)spawnBall();
  for(const ball of balls){
    ball.x+=ball.vx*delta;ball.y+=ball.vy*delta;
    if(ball.x-ball.r<0){ball.x=ball.r;ball.vx=Math.abs(ball.vx);}
    if(ball.x+ball.r>width){ball.x=width-ball.r;ball.vx=-Math.abs(ball.vx);}
    if(ball.y-ball.r<0){ball.y=ball.r;ball.vy=Math.abs(ball.vy);}
    if(ball.y+ball.r>height){ball.y=height-ball.r;ball.vy=-Math.abs(ball.vy);}
  }
  for(let i=rings.length-1;i>=0;i--){
    rings[i].life-=delta;
    if(rings[i].life<=0)rings.splice(i,1);
  }
}

function explode(start){
  const queue=[start],seen=new Set([start]);
  let count=0,depth=1;
  while(queue.length){
    const current=queue.shift();
    count++;
    const radius=Math.max(82,current.r*4.2);
    for(let i=balls.length-1;i>=0;i--){
      const ball=balls[i];
      if(seen.has(ball))continue;
      if(Math.hypot(ball.x-current.x,ball.y-current.y)<=radius+ball.r){
        seen.add(ball);
        queue.push({...ball,depth:current.depth?current.depth+1:2});
        balls.splice(i,1);
      }
    }
    if(queue.length)depth=Math.max(depth,queue[queue.length-1].depth||depth+1);
  }
  if(count>0){
    chain=depth;
    score+=count*depth;
    rings.push({x:start.x,y:start.y,r:Math.max(82,start.r*4.2),life:0.32,max:0.32});
  }
}

function tap(event){
  const rect=canvas.getBoundingClientRect(),x=(event.clientX-rect.left)*(width/rect.width),y=(event.clientY-rect.top)*(height/rect.height);
  let closest=null,closestDistance=Infinity;
  for(const ball of balls){
    const distance=Math.hypot(ball.x-x,ball.y-y);
    if(distance<ball.r+28&&distance<closestDistance){closest=ball;closestDistance=distance;}
  }
  if(closest){
    balls.splice(balls.indexOf(closest),1);
    closest.depth=1;
    explode(closest);
  }
}

function fitText(text,maxWidth,start){
  let size=start;
  context.font="900 "+size+"px system-ui,sans-serif";
  while(context.measureText(text).width>maxWidth&&size>16){
    size-=Math.max(2,size*0.06);
    context.font="900 "+size+"px system-ui,sans-serif";
  }
  return size;
}

function draw(){
  context.clearRect(0,0,width,height);
  context.fillStyle="#e9edf5";
  for(const ball of balls){context.beginPath();context.arc(ball.x,ball.y,ball.r,0,Math.PI*2);context.fill();}
  context.lineWidth=5;
  for(const ring of rings){
    context.strokeStyle="rgba(255,109,76,"+(ring.life/ring.max)+")";
    context.beginPath();context.arc(ring.x,ring.y,ring.r*(1.25-ring.life/ring.max*0.25),0,Math.PI*2);context.stroke();
  }
  const scoreText=score.toLocaleString("ja-JP"),scoreSize=fitText(scoreText,width*0.9,Math.min(width*0.34,190));
  context.fillStyle="rgba(255,255,255,0.94)";context.textAlign="center";context.textBaseline="middle";
  context.fillText(scoreText,width*0.5,height*0.46);
  if(chain>0){
    const chainText=chain.toLocaleString("ja-JP"),chainSize=fitText(chainText,width*0.6,Math.min(width*0.16,82));
    context.fillStyle="rgba(255,180,120,0.94)";
    context.fillText(chainText,width*0.5,height*0.66);
  }
}

function loop(now){
  const delta=Math.min((now-lastTime)/1000,1/30);lastTime=now;
  update(delta);draw();requestAnimationFrame(loop);
}

canvas.addEventListener("pointerdown",event=>{
  event.preventDefault();
  const now=performance.now();
  if(now-lastTap<300){reset();lastTap=0;return;}
  lastTap=now;tap(event);
});
canvas.addEventListener("contextmenu",event=>event.preventDefault());
window.addEventListener("resize",()=>{resize();reset();});
resize();reset();lastTime=performance.now();requestAnimationFrame(loop);
</script>
</body>
</html>
