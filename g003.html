<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>分裂アリーナ3</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0f0a0d; overflow: hidden; overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; background: #0f0a0d; }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";

const canvas = document.getElementById("game");
const context = canvas.getContext("2d", { alpha: false });
const BASE_BALL_RADIUS = 9;
const MAX_BALLS = 2000;
const COOLDOWN = 0.5;
const GRAVITY = 1550;
const LAUNCH_SPEED = 350;
const RESTITUTION = 0.61;
const FRICTION = 0.972;
const MAX_SPEED = 1120;
const DOUBLE_TAP_WINDOW = 0.32;

let width = 0;
let height = 0;
let ballRadius = BASE_BALL_RADIUS;
let playTop = 0;
let obstacles = [];
let balls = [];
let started = false;
let lastTapTime = -1;
let lastFrameTime = 0;

function formatScore(value) {
  return String(value).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

function buildBoard() {
  obstacles = [];
  const top = playTop + 42;
  const bottom = height - 40;
  const rows = 7;
  const columns = 5;
  const pegRadius = Math.max(9, Math.min(width / 30, 13));
  for (let row = 0; row < rows; row++) {
    for (let column = 0; column < columns; column++) {
      const offset = row % 2 ? 0.5 : 0;
      obstacles.push({
        type: "circle",
        cx: (column + 0.5 + offset) * width / columns,
        cy: top + (row + 0.5) * (bottom - top) / rows,
        radius: pegRadius
      });
    }
  }
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  width = Math.max(1, canvas.clientWidth || window.innerWidth);
  height = Math.max(1, canvas.clientHeight || window.innerHeight);
  canvas.width = Math.floor(width * dpr);
  canvas.height = Math.floor(height * dpr);
  context.setTransform(dpr, 0, 0, dpr, 0, 0);
  ballRadius = Math.max(BASE_BALL_RADIUS, Math.min(width * 0.024, 12));
  playTop = Math.max(108, Math.min(height * 0.18, 170));
  buildBoard();
  for (const ball of balls) {
    ball.x = Math.min(Math.max(ball.x, ballRadius), width - ballRadius);
    ball.y = Math.min(Math.max(ball.y, playTop + ballRadius), height - ballRadius);
  }
}

function reset() {
  balls = [];
  started = false;
}

function launch() {
  const angle = -Math.PI / 3 + Math.random() * Math.PI / 6;
  balls.push({
    x: width / 2,
    y: playTop + (height - playTop) * 0.22,
    vx: Math.cos(angle) * LAUNCH_SPEED,
    vy: Math.sin(angle) * LAUNCH_SPEED,
    cooldown: COOLDOWN
  });
  started = true;
}

function applyNormal(ball, normalX, normalY, overlap) {
  ball.x += normalX * overlap;
  ball.y += normalY * overlap;
  const normalVelocity = ball.vx * normalX + ball.vy * normalY;
  if (normalVelocity < 0) {
    const tangentX = -normalY;
    const tangentY = normalX;
    const tangentVelocity = ball.vx * tangentX + ball.vy * tangentY;
    const nextNormalVelocity = -normalVelocity * RESTITUTION;
    ball.vx = (tangentX * tangentVelocity + normalX * nextNormalVelocity) * FRICTION;
    ball.vy = (tangentY * tangentVelocity + normalY * nextNormalVelocity) * FRICTION;
  }
}

function collideObstacle(ball, obstacle) {
  const dx = ball.x - obstacle.cx;
  const dy = ball.y - obstacle.cy;
  if (Math.abs(dx) > ballRadius + obstacle.radius || Math.abs(dy) > ballRadius + obstacle.radius) return null;
  const distance = Math.hypot(dx, dy);
  const hitRadius = ballRadius + obstacle.radius;
  if (distance >= hitRadius || distance === 0) return null;
  const normalX = dx / distance;
  const normalY = dy / distance;
  applyNormal(ball, normalX, normalY, hitRadius - distance);
  return { x: normalX, y: normalY };
}

function split(parent, normalX, normalY) {
  if (parent.cooldown > 0 || balls.length >= MAX_BALLS) return;
  const childX = parent.x + normalX * ballRadius * 2.2;
  const childY = parent.y + normalY * ballRadius * 2.2;
  if (childX < ballRadius || childX > width - ballRadius || childY < playTop + ballRadius || childY > height - ballRadius) return;
  balls.push({
    x: childX,
    y: childY,
    vx: parent.vx * 0.42 + normalX * 115,
    vy: parent.vy * 0.42 + normalY * 115,
    cooldown: COOLDOWN
  });
  parent.cooldown = COOLDOWN;
}

function collideWalls(ball) {
  if (ball.x < ballRadius) {
    ball.x = ballRadius;
    ball.vx = Math.abs(ball.vx) * RESTITUTION;
    split(ball, 1, 0);
  } else if (ball.x > width - ballRadius) {
    ball.x = width - ballRadius;
    ball.vx = -Math.abs(ball.vx) * RESTITUTION;
    split(ball, -1, 0);
  }
  if (ball.y < playTop + ballRadius) {
    ball.y = playTop + ballRadius;
    ball.vy = Math.abs(ball.vy) * RESTITUTION;
    split(ball, 0, 1);
  } else if (ball.y > height - ballRadius) {
    ball.y = height - ballRadius;
    ball.vy = -Math.abs(ball.vy) * RESTITUTION;
    split(ball, 0, -1);
  }
}

function update(dt) {
  for (const ball of balls) ball.cooldown = Math.max(0, ball.cooldown - dt);
  const steps = 5;
  const stepTime = dt / steps;
  for (let step = 0; step < steps; step++) {
    for (let index = 0; index < balls.length; index++) {
      const ball = balls[index];
      ball.vy += GRAVITY * stepTime;
      const speed = Math.hypot(ball.vx, ball.vy);
      if (speed > MAX_SPEED) {
        ball.vx *= MAX_SPEED / speed;
        ball.vy *= MAX_SPEED / speed;
      }
      ball.x += ball.vx * stepTime;
      ball.y += ball.vy * stepTime;
      collideWalls(ball);
      for (const obstacle of obstacles) {
        const normal = collideObstacle(ball, obstacle);
        if (normal) split(ball, normal.x, normal.y);
      }
    }
  }
}

function drawObstacles() {
  context.fillStyle = "#523743";
  context.beginPath();
  for (const obstacle of obstacles) {
    context.moveTo(obstacle.cx + obstacle.radius, obstacle.cy);
    context.arc(obstacle.cx, obstacle.cy, obstacle.radius, 0, Math.PI * 2);
  }
  context.fill();
}

function drawScore() {
  const text = formatScore(balls.length);
  let size = Math.min(width * 0.29, 142);
  do {
    context.font = `700 ${size}px system-ui, -apple-system, sans-serif`;
    if (context.measureText(text).width <= width * 0.93) break;
    size -= 4;
  } while (size > 24);
  context.fillStyle = "#fff4f7";
  context.textAlign = "center";
  context.textBaseline = "middle";
  context.fillText(text, width / 2, playTop * 0.48, width * 0.96);
}

function draw() {
  context.fillStyle = "#0f0a0d";
  context.fillRect(0, 0, width, height);
  drawObstacles();
  context.fillStyle = "#ff6f91";
  context.beginPath();
  for (const ball of balls) {
    context.moveTo(ball.x + ballRadius, ball.y);
    context.arc(ball.x, ball.y, ballRadius, 0, Math.PI * 2);
  }
  context.fill();
  drawScore();
}

function loop(now) {
  if (!lastFrameTime) lastFrameTime = now;
  const dt = Math.min((now - lastFrameTime) / 1000, 0.033);
  lastFrameTime = now;
  if (started) update(dt);
  draw();
  requestAnimationFrame(loop);
}

canvas.addEventListener("pointerdown", event => {
  event.preventDefault();
  const now = performance.now() / 1000;
  if (now - lastTapTime <= DOUBLE_TAP_WINDOW) {
    reset();
    lastTapTime = -1;
    return;
  }
  lastTapTime = now;
  if (!started) launch();
});
canvas.addEventListener("contextmenu", event => event.preventDefault());

resize();
window.addEventListener("resize", resize);
requestAnimationFrame(loop);
</script>
</body>
</html>
