<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>分裂アリーナ</title>
<style>
html,body{margin:0;height:100%;background:#0a0d12;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100vw;height:100vh;height:100dvh;background:#0a0d12}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";
const canvas=document.getElementById("game"),context=canvas.getContext("2d",{alpha:false});
let width=393,height=852,dpr=1;
const balls=[],obstacles=[];
let score=0,running=false,lastTap=0,lastTime=0;

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  width=Math.max(1,canvas.clientWidth||window.innerWidth);
  height=Math.max(1,canvas.clientHeight||window.innerHeight);
  canvas.width=Math.floor(width*dpr);canvas.height=Math.floor(height*dpr);
  context.setTransform(dpr,0,0,dpr,0,0);
}

function reset(){
  balls.length=0;obstacles.length=0;score=0;running=false;
  const ow=Math.min(width*0.22,90),oh=Math.min(width*0.075,32);
  obstacles.push({x:width*0.16,y:height*0.28,w:ow,h:oh});
  obstacles.push({x:width*0.70,y:height*0.30,w:ow,h:oh});
  obstacles.push({x:width*0.40,y:height*0.48,w:ow*1.1,h:oh});
  obstacles.push({x:width*0.11,y:height*0.66,w:ow*0.85,h:oh});
  obstacles.push({x:width*0.70,y:height*0.70,w:ow*0.85,h:oh});
}

function launch(){
  const angle=Math.random()*Math.PI*2;
  balls.push({x:width*0.5,y:height*0.12,r:Math.max(8,width*0.023),vx:Math.cos(angle)*190,vy:Math.sin(angle)*190});
  score=1;running=true;
}

function addBall(source){
  if(balls.length>=2500)return;
  const angle=Math.random()*Math.PI*2,speed=130+Math.random()*100;
  balls.push({x:source.x,y:source.y,r:Math.max(7,width*0.019),vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed});
  score++;
}

function update(delta){
  if(!running)return;
  const maxSpeed=Math.min(width,height)*1.35;
  for(let i=0;i<balls.length;i++){
    const ball=balls[i];
    ball.x+=ball.vx*delta;ball.y+=ball.vy*delta;
    if(ball.x-ball.r<0){ball.x=ball.r;ball.vx=Math.abs(ball.vx);addBall(ball);}
    else if(ball.x+ball.r>width){ball.x=width-ball.r;ball.vx=-Math.abs(ball.vx);addBall(ball);}
    if(ball.y-ball.r<0){ball.y=ball.r;ball.vy=Math.abs(ball.vy);addBall(ball);}
    else if(ball.y+ball.r>height){ball.y=height-ball.r;ball.vy=-Math.abs(ball.vy);addBall(ball);}
    const speed=Math.hypot(ball.vx,ball.vy);
    if(speed>maxSpeed){ball.vx*=maxSpeed/speed;ball.vy*=maxSpeed/speed;}
    for(const obstacle of obstacles){
      const nearestX=Math.max(obstacle.x,Math.min(ball.x,obstacle.x+obstacle.w));
      const nearestY=Math.max(obstacle.y,Math.min(ball.y,obstacle.y+obstacle.h));
      const dx=ball.x-nearestX,dy=ball.y-nearestY,distance=Math.hypot(dx,dy);
      if(distance<ball.r){
        if(distance===0)ball.vx=-ball.vx,ball.vy=-ball.vy;
        else{
          const nx=dx/distance,ny=dy/distance,penetration=ball.r-distance;
          ball.x+=nx*penetration;ball.y+=ny*penetration;
          const dot=ball.vx*nx+ball.vy*ny;
          if(dot<0){ball.vx-=2*dot*nx;ball.vy-=2*dot*ny;}
        }
      }
    }
  }
}

function drawNumber(value){
  const text=value.toLocaleString("ja-JP");
  let size=Math.min(width*0.34,180);
  context.font="900 "+size+"px system-ui,sans-serif";
  while(context.measureText(text).width>width*0.92&&size>18){
    size-=Math.max(2,size*0.06);
    context.font="900 "+size+"px system-ui,sans-serif";
  }
  context.textAlign="center";context.textBaseline="middle";
  context.fillStyle="rgba(255,255,255,0.93)";
  context.fillText(text,width*0.5,height*0.5);
}

function draw(){
  context.clearRect(0,0,width,height);
  context.fillStyle="#263042";
  for(const obstacle of obstacles)context.fillRect(obstacle.x,obstacle.y,obstacle.w,obstacle.h);
  context.fillStyle="#f7f9ff";
  for(const ball of balls){context.beginPath();context.arc(ball.x,ball.y,ball.r,0,Math.PI*2);context.fill();}
  if(!running){
    context.fillStyle="#f7f9ff";
    context.beginPath();context.arc(width*0.5,height*0.12,Math.max(9,width*0.025),0,Math.PI*2);context.fill();
  }
  drawNumber(score);
}

function loop(now){
  const delta=Math.min((now-lastTime)/1000,1/30);lastTime=now;
  update(delta);draw();requestAnimationFrame(loop);
}

canvas.addEventListener("pointerdown",event=>{
  event.preventDefault();
  const now=performance.now();
  if(now-lastTap<300){reset();lastTap=0;return;}
  lastTap=now;
  if(!running)launch();
});
canvas.addEventListener("contextmenu",event=>event.preventDefault());
window.addEventListener("resize",()=>{resize();reset();});
resize();reset();lastTime=performance.now();requestAnimationFrame(loop);
</script>
</body>
</html>
