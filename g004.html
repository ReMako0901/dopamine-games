<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>合体ドロップ</title>
<style>
html,body{margin:0;height:100%;background:#080c14;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100vw;height:100vh;height:100dvh;background:#080c14}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";
const canvas=document.getElementById("game"),context=canvas.getContext("2d",{alpha:false});
let width=393,height=852,dpr=1;
const balls=[];
let score=0,lastTap=0,lastTime=0;

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  width=Math.max(1,canvas.clientWidth||window.innerWidth);
  height=Math.max(1,canvas.clientHeight||window.innerHeight);
  canvas.width=Math.floor(width*dpr);canvas.height=Math.floor(height*dpr);
  context.setTransform(dpr,0,0,dpr,0,0);
}

function reset(){balls.length=0;score=0;}

function radiusFor(value){
  const exponent=Math.max(1,Math.log2(value));
  return Math.min(width*0.10,width*0.031+exponent*width*0.008);
}

function drop(x,y){
  if(balls.length>=220)return;
  const radius=radiusFor(2);
  balls.push({value:2,x:Math.max(radius,Math.min(width-radius,x)),y:Math.max(radius,Math.min(height-radius,y)),r:radius,vx:0,vy:0});
}

function merge(a,b){
  const indexA=balls.indexOf(a),indexB=balls.indexOf(b);
  if(indexA<0||indexB<0)return;
  const highest=Math.max(indexA,indexB),lowest=Math.min(indexA,indexB);
  balls.splice(highest,1);balls.splice(lowest,1);
  const value=a.value*2,x=(a.x+b.x)/2,y=(a.y+b.y)/2,radius=radiusFor(value);
  balls.push({value,x:Math.max(radius,Math.min(width-radius,x)),y:Math.max(radius,Math.min(height-radius,y)),r:radius,vx:(a.vx+b.vx)*0.25,vy:(a.vy+b.vy)*0.25});
  score+=value;
}

function update(delta){
  for(const ball of balls){
    ball.vy+=800*delta;
    ball.x+=ball.vx*delta;ball.y+=ball.vy*delta;
    if(ball.x-ball.r<0){ball.x=ball.r;ball.vx=Math.abs(ball.vx)*0.35;}
    if(ball.x+ball.r>width){ball.x=width-ball.r;ball.vx=-Math.abs(ball.vx)*0.35;}
    if(ball.y+ball.r>height){ball.y=height-ball.r;ball.vy=0;ball.vx*=0.72;}
    if(ball.y-ball.r<0){ball.y=ball.r;ball.vy=Math.max(0,ball.vy);}
  }
  for(let i=0;i<balls.length;i++){
    for(let j=i+1;j<balls.length;j++){
      const a=balls[i],b=balls[j];
      if(!balls.includes(a)||!balls.includes(b))continue;
      const dx=b.x-a.x,dy=b.y-a.y,distance=Math.hypot(dx,dy),sum=a.r+b.r;
      if(a.value===b.value&&distance<=sum*0.92){merge(a,b);i=Math.max(-1,i-1);break;}
      if(distance<sum&&distance>0){
        const nx=dx/distance,ny=dy/distance,correction=(sum-distance)*0.5;
        a.x-=nx*correction;a.y-=ny*correction;
        b.x+=nx*correction;b.y+=ny*correction;
        const relative=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
        if(relative<0){
          const impulse=-relative*0.65;
          a.vx-=nx*impulse;a.vy-=ny*impulse;
          b.vx+=nx*impulse;b.vy+=ny*impulse;
        }
      }
    }
  }
}

function fitText(text,maxWidth,start){
  let size=start;
  context.font="900 "+size+"px system-ui,sans-serif";
  while(context.measureText(text).width>maxWidth&&size>9){
    size-=Math.max(1,size*0.07);
    context.font="900 "+size+"px system-ui,sans-serif";
  }
  return size;
}

function draw(){
  context.clearRect(0,0,width,height);
  context.fillStyle="rgba(255,255,255,0.08)";context.fillRect(0,height-3,width,3);
  for(const ball of balls){
    context.fillStyle=ball.value>=64?"#ef6b52":ball.value>=8?"#e6a94a":"#4f86d8";
    context.beginPath();context.arc(ball.x,ball.y,ball.r,0,Math.PI*2);context.fill();
    const text=ball.value.toLocaleString("ja-JP"),size=fitText(text,ball.r*1.65,ball.r*0.88);
    context.fillStyle="#0b0d12";context.textAlign="center";context.textBaseline="middle";
    context.fillText(text,ball.x,ball.y+size*0.04);
  }
  const scoreText=score.toLocaleString("ja-JP");
  const size=fitText(scoreText,width*0.92,Math.min(width*0.34,190));
  context.fillStyle="rgba(255,255,255,0.94)";
  context.fillText(scoreText,width*0.5,height*0.42);
}

function loop(now){
  const delta=Math.min((now-lastTime)/1000,1/30);lastTime=now;
  update(delta);draw();requestAnimationFrame(loop);
}

canvas.addEventListener("pointerdown",event=>{
  event.preventDefault();
  const now=performance.now();
  if(now-lastTap<300){reset();lastTap=0;return;}
  lastTap=now;
  const rect=canvas.getBoundingClientRect();
  drop((event.clientX-rect.left)*(width/rect.width),(event.clientY-rect.top)*(height/rect.height));
});
canvas.addEventListener("contextmenu",event=>event.preventDefault());
window.addEventListener("resize",()=>{resize();reset();});
resize();reset();lastTime=performance.now();requestAnimationFrame(loop);
</script>
</body>
</html>
