<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>磁石スウォーム</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #05080d; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; background: #05080d; }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";

const canvas = document.getElementById("game");
const context = canvas.getContext("2d", { alpha: false });
const MAX_BALLS = 200;
const MAGNET_RADIUS = 15;
const ATTRACTION = 175;
const DRAG = 0.55;
const SPLIT_COOLDOWN = 0.24;
const DOUBLE_TAP_WINDOW = 0.32;

let width = 1;
let height = 1;
let balls = [];
let score = 0;
let magnetTime = 0;
let lastFrameTime = 0;
let lastTapTime = -1;

function formatScore(value) {
  return Math.floor(value).toLocaleString("en-US");
}

function createBall(x, y, vx, vy) {
  return { x, y, vx, vy, radius: 7, cooldown: 0 };
}

function reset() {
  balls = [];
  score = 0;
  magnetTime = 0;
  for (let index = 0; index < 12; index++) {
    const angle = index * (Math.PI * 2 / 12);
    balls.push(createBall(
      width / 2 + Math.cos(angle) * width * 0.32,
      height / 2 + Math.sin(angle) * height * 0.22,
      (Math.random() * 2 - 1) * 25,
      (Math.random() * 2 - 1) * 25
    ));
  }
  score = balls.length;
}

function resize() {
  const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
  const oldWidth = width;
  const oldHeight = height;
  width = Math.max(1, canvas.clientWidth || window.innerWidth);
  height = Math.max(1, canvas.clientHeight || window.innerHeight);
  canvas.width = Math.floor(width * pixelRatio);
  canvas.height = Math.floor(height * pixelRatio);
  context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
  if (oldWidth !== width || oldHeight !== height) reset();
}

function getMagnet() {
  return {
    x: width * (0.5 + Math.sin(magnetTime * 0.24) * 0.27),
    y: height * (0.48 + Math.sin(magnetTime * 0.19 + 1.2) * 0.2)
  };
}

function updateBalls(dt) {
  const magnet = getMagnet();
  const newBalls = [];

  for (const ball of balls) {
    ball.cooldown -= dt;
    const dx = magnet.x - ball.x;
    const dy = magnet.y - ball.y;
    const distance = Math.max(1, Math.hypot(dx, dy));
    ball.vx += (dx / distance) * ATTRACTION * dt;
    ball.vy += (dy / distance) * ATTRACTION * dt;
    ball.vx -= ball.vx * DRAG * dt;
    ball.vy -= ball.vy * DRAG * dt;
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    if (ball.x < ball.radius) {
      ball.x = ball.radius;
      ball.vx = Math.abs(ball.vx);
    } else if (ball.x > width - ball.radius) {
      ball.x = width - ball.radius;
      ball.vx = -Math.abs(ball.vx);
    }
    if (ball.y < ball.radius) {
      ball.y = ball.radius;
      ball.vy = Math.abs(ball.vy);
    } else if (ball.y > height - ball.radius) {
      ball.y = height - ball.radius;
      ball.vy = -Math.abs(ball.vy);
    }

    if (ball.cooldown <= 0 && Math.hypot(ball.x - magnet.x, ball.y - magnet.y) <= MAGNET_RADIUS + ball.radius) {
      const angle = Math.atan2(ball.y - magnet.y, ball.x - magnet.x);
      ball.vx = Math.cos(angle) * 190;
      ball.vy = Math.sin(angle) * 190;
      ball.x = magnet.x + Math.cos(angle) * (MAGNET_RADIUS + ball.radius);
      ball.y = magnet.y + Math.sin(angle) * (MAGNET_RADIUS + ball.radius);
      ball.cooldown = SPLIT_COOLDOWN;

      if (balls.length + newBalls.length < MAX_BALLS) {
        const childAngle = angle + (Math.random() * 2 - 1) * 0.65;
        const child = createBall(
          ball.x,
          ball.y,
          Math.cos(childAngle) * 210,
          Math.sin(childAngle) * 210
        );
        child.cooldown = SPLIT_COOLDOWN;
        newBalls.push(child);
      }
    }
  }

  balls.push(...newBalls);
  score = balls.length;
}

function drawScore() {
  const text = formatScore(score);
  let size = Math.min(height * 0.24, 190);
  context.textAlign = "center";
  context.textBaseline = "middle";
  context.font = "900 " + size + "px system-ui, -apple-system, sans-serif";
  const maxWidth = width * 0.94;
  const measuredWidth = context.measureText(text).width;
  if (measuredWidth > maxWidth) {
    size = Math.max(20, size * maxWidth / measuredWidth);
    context.font = "900 " + size + "px system-ui, -apple-system, sans-serif";
  }
  context.fillStyle = "#f4f8ff";
  context.fillText(text, width / 2, height / 2);
}

function draw() {
  context.fillStyle = "#05080d";
  context.fillRect(0, 0, width, height);
  const magnet = getMagnet();
  context.fillStyle = "#ff4b5c";
  context.beginPath();
  context.arc(magnet.x, magnet.y, MAGNET_RADIUS, 0, Math.PI * 2);
  context.fill();

  context.fillStyle = "#78e8ff";
  for (const ball of balls) {
    context.beginPath();
    context.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    context.fill();
  }
  drawScore();
}

function update(timestamp) {
  if (!lastFrameTime) lastFrameTime = timestamp;
  const dt = Math.min(0.033, (timestamp - lastFrameTime) / 1000);
  lastFrameTime = timestamp;
  if (dt > 0) {
    magnetTime += dt;
    updateBalls(dt);
  }
  draw();
  requestAnimationFrame(update);
}

canvas.addEventListener("pointerdown", event => {
  event.preventDefault();
  const now = performance.now() / 1000;
  if (now - lastTapTime <= DOUBLE_TAP_WINDOW) {
    reset();
    lastTapTime = -1;
  } else {
    lastTapTime = now;
  }
});
canvas.addEventListener("contextmenu", event => event.preventDefault());
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", resize);
document.addEventListener("visibilitychange", () => { lastFrameTime = 0; });

resize();
reset();
requestAnimationFrame(update);
</script>
</body>
</html>
