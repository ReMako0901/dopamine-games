<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>自動ピンボール</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #05070c; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; background: #05070c; }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";

const canvas = document.getElementById("game");
const context = canvas.getContext("2d", { alpha: false });
const MAX_BALLS = 180;
const GRAVITY = 620;
const WALL_RESTITUTION = 0.85;
const DOUBLE_TAP_WINDOW = 0.32;

let width = 1;
let height = 1;
let balls = [];
let bumpers = [];
let flippers = [];
let score = 0;
let flipPhase = 0;
let lastFrameTime = 0;
let lastTapTime = -1;

function formatScore(value) {
  return Math.floor(value).toLocaleString("en-US");
}

function createBall() {
  score++;
  return {
    x: width * 0.5 + (Math.random() * 2 - 1) * width * 0.06,
    y: -10,
    vx: (Math.random() * 2 - 1) * 75,
    vy: 80,
    radius: 7,
    hitCooldown: 0.18
  };
}

function reset() {
  balls = [];
  bumpers = [];
  flippers = [];
  score = 0;
  flipPhase = 0;
  const positions = [
    [0.24, 0.23], [0.5, 0.17], [0.76, 0.23],
    [0.16, 0.46], [0.39, 0.38], [0.61, 0.38], [0.84, 0.46],
    [0.26, 0.6], [0.5, 0.54], [0.74, 0.6]
  ];
  for (const [xRatio, yRatio] of positions) {
    bumpers.push({ x: width * xRatio, y: height * yRatio, radius: Math.max(14, width * 0.045), flash: 0 });
  }
  flippers = [
    { x: width * 0.28, y: height * 0.88, length: width * 0.24, side: -1 },
    { x: width * 0.72, y: height * 0.88, length: width * 0.24, side: 1 }
  ];
  balls.push(createBall());
}

function resize() {
  const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
  const oldWidth = width;
  const oldHeight = height;
  width = Math.max(1, canvas.clientWidth || window.innerWidth);
  height = Math.max(1, canvas.clientHeight || window.innerHeight);
  canvas.width = Math.floor(width * pixelRatio);
  canvas.height = Math.floor(height * pixelRatio);
  context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
  if (oldWidth !== width || oldHeight !== height) reset();
}

function resolveBumper(ball, bumper) {
  const dx = ball.x - bumper.x;
  const dy = ball.y - bumper.y;
  const distance = Math.hypot(dx, dy);
  const minimum = bumper.radius + ball.radius;
  if (distance >= minimum) return;

  const nx = dx / (distance || 1);
  const ny = dy / (distance || 1);
  ball.x = bumper.x + nx * minimum;
  ball.y = bumper.y + ny * minimum;
  const dot = ball.vx * nx + ball.vy * ny;
  ball.vx = (ball.vx - 2 * dot * nx) * 0.88;
  ball.vy = (ball.vy - 2 * dot * ny) * 0.88;
  const speed = Math.hypot(ball.vx, ball.vy);
  const targetSpeed = 360;
  if (speed < targetSpeed) {
    ball.vx += nx * (targetSpeed - speed);
    ball.vy += ny * (targetSpeed - speed);
  }
  bumper.flash = 0.12;

  if (ball.hitCooldown <= 0 && balls.length < MAX_BALLS) {
    ball.hitCooldown = 0.22;
    const child = createBall();
    child.x = ball.x;
    child.y = ball.y;
    child.vx = ball.vx * 0.55 + (Math.random() * 2 - 1) * 55;
    child.vy = ball.vy * 0.55 - 80;
    balls.push(child);
  }
}

function getFlipperEnd(flipper) {
  const angle = 0.35 + Math.max(0, Math.sin(flipPhase)) * 0.9;
  const direction = flipper.side;
  return {
    x: flipper.x + direction * flipper.length * Math.cos(angle),
    y: flipper.y - flipper.length * Math.sin(angle)
  };
}

function resolveFlipper(ball, flipper) {
  const end = getFlipperEnd(flipper);
  const ex = end.x - flipper.x;
  const ey = end.y - flipper.y;
  const lengthSquared = ex * ex + ey * ey;
  const t = Math.max(0, Math.min(1, ((ball.x - flipper.x) * ex + (ball.y - flipper.y) * ey) / lengthSquared));
  const px = flipper.x + ex * t;
  const py = flipper.y + ey * t;
  const dx = ball.x - px;
  const dy = ball.y - py;
  const distance = Math.hypot(dx, dy);
  if (distance >= ball.radius + 5) return;

  let nx = dx / (distance || 1);
  let ny = dy / (distance || 1);
  if (ny > 0) {
    nx = -nx;
    ny = -ny;
  }
  ball.x = px + nx * (ball.radius + 5);
  ball.y = py + ny * (ball.radius + 5);
  const dot = ball.vx * nx + ball.vy * ny;
  ball.vx = (ball.vx - 2 * dot * nx) * 0.9;
  ball.vy = (ball.vy - 2 * dot * ny) * 0.9 - 150;
}

function updateBalls(dt) {
  for (let index = balls.length - 1; index >= 0; index--) {
    const ball = balls[index];
    ball.hitCooldown -= dt;
    ball.vy += GRAVITY * dt;
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    if (ball.x < ball.radius) {
      ball.x = ball.radius;
      ball.vx = Math.abs(ball.vx) * WALL_RESTITUTION;
    } else if (ball.x > width - ball.radius) {
      ball.x = width - ball.radius;
      ball.vx = -Math.abs(ball.vx) * WALL_RESTITUTION;
    }
    if (ball.y < ball.radius) {
      ball.y = ball.radius;
      ball.vy = Math.abs(ball.vy) * WALL_RESTITUTION;
    }

    for (const bumper of bumpers) resolveBumper(ball, bumper);
    for (const flipper of flippers) resolveFlipper(ball, flipper);
    if (ball.y > height + 30) balls.splice(index, 1);
  }

  if (balls.length === 0) balls.push(createBall());
}

function drawScore() {
  const text = formatScore(score);
  let size = Math.min(height * 0.24, 190);
  context.textAlign = "center";
  context.textBaseline = "middle";
  context.font = "900 " + size + "px system-ui, -apple-system, sans-serif";
  const maxWidth = width * 0.94;
  const measuredWidth = context.measureText(text).width;
  if (measuredWidth > maxWidth) {
    size = Math.max(20, size * maxWidth / measuredWidth);
    context.font = "900 " + size + "px system-ui, -apple-system, sans-serif";
  }
  context.fillStyle = "#f4f8ff";
  context.fillText(text, width / 2, height / 2);
}

function draw() {
  context.fillStyle = "#05070c";
  context.fillRect(0, 0, width, height);
  for (const bumper of bumpers) {
    context.fillStyle = bumper.flash > 0 ? "#fff2a8" : "#2f6cff";
    context.beginPath();
    context.arc(bumper.x, bumper.y, bumper.radius, 0, Math.PI * 2);
    context.fill();
    bumper.flash -= 0.016;
  }

  context.lineCap = "round";
  context.lineWidth = 10;
  context.strokeStyle = "#ff5f8f";
  for (const flipper of flippers) {
    const end = getFlipperEnd(flipper);
    context.beginPath();
    context.moveTo(flipper.x, flipper.y);
    context.lineTo(end.x, end.y);
    context.stroke();
  }

  context.fillStyle = "#57ffd5";
  for (const ball of balls) {
    context.beginPath();
    context.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    context.fill();
  }
  drawScore();
}

function update(timestamp) {
  if (!lastFrameTime) lastFrameTime = timestamp;
  const dt = Math.min(0.033, (timestamp - lastFrameTime) / 1000);
  lastFrameTime = timestamp;
  if (dt > 0) {
    flipPhase += dt * 5;
    updateBalls(dt);
  }
  draw();
  requestAnimationFrame(update);
}

canvas.addEventListener("pointerdown", event => {
  event.preventDefault();
  const now = performance.now() / 1000;
  if (now - lastTapTime <= DOUBLE_TAP_WINDOW) {
    reset();
    lastTapTime = -1;
  } else {
    lastTapTime = now;
  }
});
canvas.addEventListener("contextmenu", event => event.preventDefault());
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", resize);
document.addEventListener("visibilitychange", () => { lastFrameTime = 0; });

resize();
reset();
requestAnimationFrame(update);
</script>
</body>
</html>
