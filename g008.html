<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>巨大化分裂</title>
  <style>
    html, body { margin: 0; height: 100%; background: #07090c; overflow: hidden; overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; background: #07090c; }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";

const canvas = document.getElementById("game");
const context = canvas.getContext("2d", { alpha: false });
const MAX_BALLS = 110;
const MIN_RADIUS = 8;
const MAX_RADIUS = 43;
const GROWTH = 0.65;
const GRAVITY = 620;
const RESTITUTION = 0.88;
const DOUBLE_TAP_WINDOW = 320;
const COLORS = ["#7fd0a3", "#f2c66b", "#8ca7ee", "#e88b8b"];

let width = 1;
let height = 1;
let balls = [];
let splitCount = 0n;
let lastTapTime = -DOUBLE_TAP_WINDOW;
let lastFrameTime = 0;

function formatBigInt(value) {
  return value.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

function resize() {
  const devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
  width = Math.max(1, canvas.clientWidth || window.innerWidth);
  height = Math.max(1, canvas.clientHeight || window.innerHeight);
  canvas.width = Math.floor(width * devicePixelRatio);
  canvas.height = Math.floor(height * devicePixelRatio);
  context.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}

function createBall(radius, x, y, vx, vy) {
  return {
    radius,
    x,
    y,
    vx,
    vy,
    color: COLORS[Math.floor(Math.random() * COLORS.length)]
  };
}

function reset() {
  balls = [
    createBall(MIN_RADIUS + 2, width * 0.32, height * 0.28, 145, 45),
    createBall(MIN_RADIUS + 4, width * 0.68, height * 0.22, -125, 85)
  ];
  splitCount = 0n;
}

function spawnBall() {
  if (balls.length >= MAX_BALLS) return;
  balls.push(createBall(
    MIN_RADIUS + 1,
    Math.random() * width,
    height * 0.2,
    (Math.random() - 0.5) * 210,
    40 + Math.random() * 90
  ));
}

function split(ball) {
  const index = balls.indexOf(ball);
  if (index >= 0) balls.splice(index, 1);
  while (balls.length > MAX_BALLS - 2) balls.shift();
  splitCount += 1n;

  const angle = Math.atan2(ball.vy, ball.vx) + Math.PI / 2;
  const speed = Math.max(150, Math.hypot(ball.vx, ball.vy) * 0.62);
  for (let side = -1; side <= 1; side += 2) {
    balls.push(createBall(
      MIN_RADIUS,
      ball.x + Math.cos(angle) * side * 4,
      ball.y + Math.sin(angle) * side * 4,
      Math.cos(angle) * speed * side + ball.vx * 0.22,
      Math.sin(angle) * speed * side + ball.vy * 0.22
    ));
  }
}

function update(delta) {
  for (let index = 0; index < balls.length; index++) {
    const ball = balls[index];
    ball.vy += GRAVITY * delta;
    ball.x += ball.vx * delta;
    ball.y += ball.vy * delta;

    if (ball.x < ball.radius) {
      ball.x = ball.radius;
      if (ball.vx < 0) ball.vx = -ball.vx * RESTITUTION;
      ball.radius += GROWTH;
    } else if (ball.x > width - ball.radius) {
      ball.x = width - ball.radius;
      if (ball.vx > 0) ball.vx = -ball.vx * RESTITUTION;
      ball.radius += GROWTH;
    }
    if (ball.y < ball.radius) {
      ball.y = ball.radius;
      if (ball.vy < 0) ball.vy = -ball.vy * RESTITUTION;
      ball.radius += GROWTH;
    } else if (ball.y > height - ball.radius) {
      ball.y = height - ball.radius;
      if (ball.vy > 0) ball.vy = -ball.vy * RESTITUTION;
      ball.radius += GROWTH;
    }

    if (ball.radius >= MAX_RADIUS) {
      split(ball);
      index--;
    }
  }
}

function drawNumber(value) {
  const text = formatBigInt(value);
  let size = Math.min(width * 0.30, height * 0.25);
  const maxWidth = width * 0.92;
  do {
    context.font = `700 ${size}px "Helvetica Neue", Arial, sans-serif`;
    if (context.measureText(text).width <= maxWidth) break;
    size *= 0.88;
  } while (size > 9);
  context.textAlign = "center";
  context.textBaseline = "middle";
  context.fillStyle = "#eef3ff";
  context.fillText(text, width / 2, height * 0.16);
}

function frame(now) {
  if (!lastFrameTime) lastFrameTime = now;
  const delta = Math.min((now - lastFrameTime) / 1000, 0.035);
  lastFrameTime = now;
  update(delta);

  context.fillStyle = "#07090c";
  context.fillRect(0, 0, width, height);
  for (const ball of balls) {
    context.beginPath();
    context.arc(ball.x, ball.y, Math.max(1, ball.radius), 0, Math.PI * 2);
    context.fillStyle = ball.color;
    context.fill();
  }
  drawNumber(splitCount);
  requestAnimationFrame(frame);
}

canvas.addEventListener("pointerdown", (event) => {
  event.preventDefault();
  const now = performance.now();
  if (now - lastTapTime < DOUBLE_TAP_WINDOW) {
    reset();
    lastTapTime = -DOUBLE_TAP_WINDOW;
  } else {
    lastTapTime = now;
    spawnBall();
  }
}, { passive: false });

window.addEventListener("resize", resize);
window.addEventListener("orientationchange", resize);

resize();
reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
