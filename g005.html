<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ゲートラッシュ</title>
<style>
html,body{margin:0;height:100%;background:#0a0b12;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100vw;height:100vh;height:100dvh;background:#0a0b12}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";
const canvas=document.getElementById("game"),context=canvas.getContext("2d",{alpha:false});
let width=393,height=852,dpr=1;
const balls=[],gates=[];
let score=0,lastTap=0,lastTime=0,spawnTimer=0,elapsed=0;

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  width=Math.max(1,canvas.clientWidth||window.innerWidth);
  height=Math.max(1,canvas.clientHeight||window.innerHeight);
  canvas.width=Math.floor(width*dpr);canvas.height=Math.floor(height*dpr);
  context.setTransform(dpr,0,0,dpr,0,0);
}

function reset(){
  balls.length=0;gates.length=0;score=0;spawnTimer=0;elapsed=0;
  const gateW=width*0.36;
  for(let index=0;index<3;index++){
    gates.push({
      y:height*(0.20+index*0.18),
      w:gateW,
      phase:index*1.9,
      speed:0.65+index*0.25
    });
  }
}

function spawn(){
  if(balls.length>=500)return;
  const radius=Math.max(5,width*0.013);
  balls.push({x:radius+Math.random()*(width-radius*2),y:-radius,r:radius,vy:170+Math.random()*70,passed:[false,false,false]});
}

function update(delta){
  elapsed+=delta;
  spawnTimer-=delta;
  if(spawnTimer<=0){spawn();spawnTimer=0.28;}
  for(const gate of gates){
    const range=(width-gate.w)/2;
    gate.x=width/2+Math.sin(elapsed*gate.speed+gate.phase)*range;
  }
  const newBalls=[];
  for(let i=balls.length-1;i>=0;i--){
    const ball=balls[i];
    ball.y+=ball.vy*delta;
    for(let gateIndex=0;gateIndex<gates.length;gateIndex++){
      const gate=gates[gateIndex];
      if(!ball.passed[gateIndex]&&ball.y>=gate.y){
        ball.passed[gateIndex]=true;
        if(ball.x>=gate.x&&ball.x<gate.x+gate.w/2){
          newBalls.push({...ball,y:gate.y+ball.r*2,x:Math.min(width-ball.r,ball.x+ball.r*2),passed:[gateIndex===0, gateIndex===1, gateIndex===2]});
        }else if(ball.x>=gate.x+gate.w/2&&ball.x<=gate.x+gate.w){
          balls.splice(i,1);
          break;
        }
      }
    }
    if(i<balls.length&&balls[i]===ball&&ball.y-ball.r>height){
      score++;
      balls.splice(i,1);
    }
  }
  for(const ball of newBalls)if(balls.length<500)balls.push(ball);
}

function fitText(text,maxWidth,start){
  let size=start;
  context.font="900 "+size+"px system-ui,sans-serif";
  while(context.measureText(text).width>maxWidth&&size>18){
    size-=Math.max(2,size*0.06);
    context.font="900 "+size+"px system-ui,sans-serif";
  }
  return size;
}

function draw(){
  context.clearRect(0,0,width,height);
  const gateH=Math.max(8,width*0.024);
  for(const gate of gates){
    context.fillStyle="#2ee37b";context.fillRect(gate.x,gate.y-gateH/2,gate.w/2,gateH);
    context.fillStyle="#e34a4a";context.fillRect(gate.x+gate.w/2,gate.y-gateH/2,gate.w/2,gateH);
    const labelSize=Math.max(10,gateH*0.72);
    context.font="900 "+labelSize+"px system-ui,sans-serif";
    context.textAlign="center";context.textBaseline="middle";context.fillStyle="#080a10";
    context.fillText("×2",gate.x+gate.w/4,gate.y);
    context.fillText("×0",gate.x+gate.w*0.75,gate.y);
  }
  context.fillStyle="#eef4ff";
  for(const ball of balls){context.beginPath();context.arc(ball.x,ball.y,ball.r,0,Math.PI*2);context.fill();}
  const text=score.toLocaleString("ja-JP"),size=fitText(text,width*0.92,Math.min(width*0.34,190));
  context.fillStyle="rgba(255,255,255,0.94)";
  context.fillText(text,width*0.5,height*0.80);
}

function loop(now){
  const delta=Math.min((now-lastTime)/1000,1/30);lastTime=now;
  update(delta);draw();requestAnimationFrame(loop);
}

canvas.addEventListener("pointerdown",event=>{
  event.preventDefault();
  const now=performance.now();
  if(now-lastTap<300){reset();lastTap=0;return;}
  lastTap=now;
});
canvas.addEventListener("contextmenu",event=>event.preventDefault());
window.addEventListener("resize",()=>{resize();reset();});
resize();reset();lastTime=performance.now();requestAnimationFrame(loop);
</script>
</body>
</html>
