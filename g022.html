<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>バランス天秤</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #05080d; overflow: hidden; overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; background: #05080d; }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";

const canvas = document.getElementById("game");
const context = canvas.getContext("2d", { alpha: false });
const DOUBLE_TAP_WINDOW = 320;

let width = 1;
let height = 1;
let scoreFloat = 0;
let leftWeights = [];
let rightWeights = [];
let leftTotal = 0;
let rightTotal = 0;
let autoTimer = 0;
let autoLeft = true;
let swayTime = 0;
let balancedTime = 0;
let angle = 0;
let lastTapTime = -DOUBLE_TAP_WINDOW;
let lastFrameTime = 0;

function formatScore(value) {
  return value.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

function resize() {
  const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
  width = Math.max(1, canvas.clientWidth || window.innerWidth);
  height = Math.max(1, canvas.clientHeight || window.innerHeight);
  canvas.width = Math.floor(width * pixelRatio);
  canvas.height = Math.floor(height * pixelRatio);
  context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
}

function reset() {
  scoreFloat = 0;
  leftWeights = [];
  rightWeights = [];
  leftTotal = 0;
  rightTotal = 0;
  autoTimer = 0;
  swayTime = 0;
  balancedTime = 0;
  angle = 0;
  addAutoWeight(1 + Math.floor(Math.random() * 2), true);
  addAutoWeight(1 + Math.floor(Math.random() * 2), false);
  autoLeft = true;
}

function addAutoWeight(value, toLeft) {
  const target = toLeft ? leftWeights : rightWeights;
  target.push(value);
  if (target.length > 16) target.shift();
  if (toLeft) leftTotal += value;
  else rightTotal += value;
}

function addTapWeight(toLeft) {
  addAutoWeight(1, toLeft);
}

function totalWeight() {
  return leftTotal + rightTotal;
}

function isBalanced() {
  const total = totalWeight();
  const tolerance = Math.max(3, total * 0.16);
  return Math.abs(leftTotal - rightTotal) <= tolerance;
}

function update(delta) {
  autoTimer += delta;
  const autoInterval = Math.max(0.34, 0.85 - totalWeight() * 0.0008);
  if (autoTimer >= autoInterval) {
    autoTimer = 0;
    addAutoWeight(1 + Math.floor(Math.random() * 3), autoLeft);
    autoLeft = !autoLeft;
  }

  const balanced = isBalanced();
  if (balanced) {
    balancedTime += delta;
    scoreFloat = Math.min(Number.MAX_SAFE_INTEGER, scoreFloat + totalWeight() * delta * 2);
  } else {
    balancedTime = 0;
  }

  swayTime += delta;
  const imbalance = (rightTotal - leftTotal) / Math.max(1, totalWeight());
  const targetAngle = Math.max(-0.26, Math.min(0.26, imbalance * 0.45));
  angle += (targetAngle - angle) * Math.min(1, delta * 5);
}

function drawNumber() {
  const text = formatScore(BigInt(Math.floor(scoreFloat)));
  let size = Math.min(width * 0.24, height * 0.16);
  const maxWidth = width * 0.9;
  do {
    context.font = `900 ${size}px "Helvetica Neue", Arial, sans-serif`;
    if (context.measureText(text).width <= maxWidth) break;
    size *= 0.88;
  } while (size > 9);
  context.textAlign = "center";
  context.textBaseline = "middle";
  context.fillStyle = isBalanced() ? "#f2f7ff" : "#aeb8cc";
  context.fillText(text, width / 2, height * 0.14);
}

function drawStack(weights, panX, panY) {
  const visible = Math.min(weights.length, 12);
  const blockHeight = Math.max(6, Math.min(15, 88 / Math.max(1, visible)));
  const blockWidth = Math.max(18, width * 0.09);
  for (let index = 0; index < visible; index++) {
    const value = weights[weights.length - visible + index];
    const y = panY - blockHeight * (index + 1);
    context.fillStyle = value === 1 ? "#7ce8b5" : value === 2 ? "#ffd166" : "#ff9aa8";
    context.fillRect(panX - blockWidth / 2, y, blockWidth, blockHeight - 1);
  }
}

function draw() {
  context.fillStyle = "#05080d";
  context.fillRect(0, 0, width, height);

  const pivotX = width / 2;
  const pivotY = height * 0.52;
  const beamHalf = Math.min(width * 0.42, 170);
  context.fillStyle = isBalanced() ? "#8ce99a" : "#f783ac";
  context.fillRect(pivotX - beamHalf, pivotY - 4, beamHalf * 2, 8);

  context.fillStyle = "#343a46";
  context.beginPath();
  context.moveTo(pivotX - 12, height * 0.78);
  context.lineTo(pivotX + 12, height * 0.78);
  context.lineTo(pivotX, pivotY);
  context.closePath();
  context.fill();

  context.save();
  context.translate(pivotX, pivotY);
  context.rotate(angle);
  const leftX = -beamHalf;
  const rightX = beamHalf;
  const panDrop = 42;
  context.fillStyle = "#495057";
  context.fillRect(leftX - 42, panDrop, 84, 7);
  context.fillRect(rightX - 42, panDrop, 84, 7);
  context.strokeStyle = "#74808c";
  context.lineWidth = 2;
  context.beginPath();
  context.moveTo(leftX, 0);
  context.lineTo(leftX, panDrop);
  context.moveTo(rightX, 0);
  context.lineTo(rightX, panDrop);
  context.stroke();
  drawStack(leftWeights, leftX, panDrop);
  drawStack(rightWeights, rightX, panDrop);
  context.restore();

  drawNumber();
}

function frame(now) {
  if (!lastFrameTime) lastFrameTime = now;
  const delta = Math.min((now - lastFrameTime) / 1000, 0.035);
  lastFrameTime = now;
  update(delta);
  draw();
  requestAnimationFrame(frame);
}

canvas.addEventListener("pointerdown", (event) => {
  event.preventDefault();
  const now = performance.now();
  if (now - lastTapTime < DOUBLE_TAP_WINDOW) {
    reset();
    lastTapTime = -DOUBLE_TAP_WINDOW;
  } else {
    lastTapTime = now;
    addTapWeight(event.clientX < width / 2);
  }
}, { passive: false });

window.addEventListener("resize", () => {
  resize();
  reset();
});
window.addEventListener("orientationchange", () => {
  resize();
  reset();
});

resize();
reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
