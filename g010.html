<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>渦巻き増殖</title>
  <style>
    html, body { margin: 0; height: 100%; background: #070911; overflow: hidden; overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; background: #070911; }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";

const canvas = document.getElementById("game");
const context = canvas.getContext("2d", { alpha: false });
const MAX_BALLS = 210;
const JOINT_STEP = Math.PI / 3;
const BASE_RADIUS = 24;
const SPACING = 30;
const BALL_RADIUS = 5;
const DOUBLE_TAP_WINDOW = 320;
const COLORS = ["#8fd4b4", "#f3c86f", "#8ba5e8", "#e78d94"];

let width = 1;
let height = 1;
let balls = [];
let spiralPath = [];
let lastTapTime = -DOUBLE_TAP_WINDOW;
let lastFrameTime = 0;

function formatBigInt(value) {
  return value.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

function angleToRadius(angle) {
  return BASE_RADIUS + SPACING * angle / (Math.PI * 2);
}

function pointAt(angle, lane = 0) {
  const radius = angleToRadius(angle) + lane;
  return {
    x: width / 2 + Math.cos(angle) * radius,
    y: height / 2 + Math.sin(angle) * radius
  };
}

function resize() {
  const devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
  width = Math.max(1, canvas.clientWidth || window.innerWidth);
  height = Math.max(1, canvas.clientHeight || window.innerHeight);
  canvas.width = Math.floor(width * devicePixelRatio);
  canvas.height = Math.floor(height * devicePixelRatio);
  context.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  buildSpiralPath();
}

function buildSpiralPath() {
  spiralPath = [];
  const maximumRadius = Math.min(width, height) * 0.44;
  const maximumAngle = Math.max(Math.PI * 2, (maximumRadius - BASE_RADIUS) / SPACING * Math.PI * 2);
  const stepCount = Math.max(12, Math.ceil(maximumAngle / (Math.PI / 24)));
  for (let index = 0; index <= stepCount; index++) {
    const angle = (index / stepCount) * maximumAngle;
    spiralPath.push({ angle, point: pointAt(angle) });
  }
}

function createSpiralBall(angle, lane, direction) {
  return {
    angle,
    lane,
    direction,
    speed: 1.05 + Math.random() * 0.35,
    color: COLORS[Math.floor(Math.random() * COLORS.length)]
  };
}

function reset() {
  balls = [
    createSpiralBall(0, 0, 1),
    createSpiralBall(Math.PI * 1.3, 3, -1),
    createSpiralBall(Math.PI * 2.1, -3, 1)
  ];
}

function addBall() {
  if (balls.length >= MAX_BALLS) return;
  balls.push(createSpiralBall(Math.random() * Math.PI * 2, (Math.random() - 0.5) * 10, Math.random() < 0.5 ? 1 : -1));
}

function maximumAngle() {
  return spiralPath.length > 1 ? spiralPath[spiralPath.length - 1].angle : Math.PI * 2;
}

function proliferateAt(angle) {
  if (balls.length >= MAX_BALLS) return;
  const direction = Math.random() < 0.5 ? 1 : -1;
  balls.push(createSpiralBall(angle + direction * 0.035, (Math.random() - 0.5) * 12, direction));
}

function update(delta) {
  const limit = maximumAngle();
  for (const ball of balls) {
    const previousJoint = Math.floor(ball.angle / JOINT_STEP);
    ball.angle += ball.direction * ball.speed * delta;
    if (Math.floor(ball.angle / JOINT_STEP) !== previousJoint) proliferateAt(ball.angle);
    if (ball.angle < 0) ball.angle = limit;
    else if (ball.angle > limit) ball.angle = 0;
  }
}

function drawNumber(value) {
  const text = formatBigInt(value);
  let size = Math.min(width * 0.28, height * 0.22);
  const maxWidth = width * 0.90;
  do {
    context.font = `700 ${size}px "Helvetica Neue", Arial, sans-serif`;
    if (context.measureText(text).width <= maxWidth) break;
    size *= 0.88;
  } while (size > 9);
  context.textAlign = "center";
  context.textBaseline = "middle";
  context.fillStyle = "#edf3ff";
  context.fillText(text, width / 2, height * 0.14);
}

function frame(now) {
  if (!lastFrameTime) lastFrameTime = now;
  const delta = Math.min((now - lastFrameTime) / 1000, 0.035);
  lastFrameTime = now;
  update(delta);

  context.fillStyle = "#070911";
  context.fillRect(0, 0, width, height);
  context.beginPath();
  context.moveTo(spiralPath[0].point.x, spiralPath[0].point.y);
  for (let index = 1; index < spiralPath.length; index++) {
    context.lineTo(spiralPath[index].point.x, spiralPath[index].point.y);
  }
  context.strokeStyle = "#31425c";
  context.lineWidth = 4;
  context.stroke();

  const limit = maximumAngle();
  for (let angle = 0; angle <= limit; angle += JOINT_STEP) {
    const point = pointAt(angle);
    context.beginPath();
    context.arc(point.x, point.y, 4, 0, Math.PI * 2);
    context.fillStyle = "#5f7697";
    context.fill();
  }

  context.beginPath();
  context.arc(width / 2, height / 2, BASE_RADIUS - 7, 0, Math.PI * 2);
  context.fillStyle = "#566d8c";
  context.fill();

  for (const ball of balls) {
    const point = pointAt(ball.angle, ball.lane);
    context.beginPath();
    context.arc(point.x, point.y, BALL_RADIUS, 0, Math.PI * 2);
    context.fillStyle = ball.color;
    context.fill();
  }
  drawNumber(BigInt(balls.length));
  requestAnimationFrame(frame);
}

canvas.addEventListener("pointerdown", (event) => {
  event.preventDefault();
  const now = performance.now();
  if (now - lastTapTime < DOUBLE_TAP_WINDOW) {
    reset();
    lastTapTime = -DOUBLE_TAP_WINDOW;
  } else {
    lastTapTime = now;
    addBall();
  }
}, { passive: false });

window.addEventListener("resize", resize);
window.addEventListener("orientationchange", resize);

resize();
reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
